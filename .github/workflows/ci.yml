name: ci

# FOUND-09 (D-30 LOCKED): 6 required jobs run in parallel on every PR and push to main,
# plus a compose-config sanity job (W-7) validating docker-compose.yml + Taskfile.yml.
# Required-status-check enforcement lives in GitHub repo Settings > Branches (D-31 — see
# .github/branch-protection.md). All actions pinned to specific major versions per
# ASVS V14.3 (CI/build pipeline integrity); NEVER use @latest.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: go vet
        working-directory: services/api
        run: go vet ./...

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: services/api

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: go test
        working-directory: services/api
        # Includes testcontainers-go isolation suite under ./test/isolation/...
        # GitHub Actions runners ship with Docker preinstalled; testcontainers-go uses
        # it directly. No --privileged flag or setup-docker action needed.
        run: go test -race -timeout=10m ./...

  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        working-directory: web
        run: pnpm -F '*' typecheck

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: pnpm lint
        working-directory: web
        run: pnpm -F '*' lint

  migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drift
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - name: migrate up
        env:
          DATABASE_URL: "postgres://postgres:drift@localhost:5432/postgres?sslmode=disable"
        run: |
          migrate -path migrations -database "$DATABASE_URL" up
          migrate -path migrations -database "$DATABASE_URL" version

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config parses
        run: docker compose config > /dev/null
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.40.0
      - name: Taskfile parses
        run: |
          $(go env GOPATH)/bin/task --list > /dev/null

  codegen-drift:
    # Phase 2 D-47 + D-48 + CONTRACT-04: spec lint (Redocly recommended) then
    # full codegen (sqlc + oapi-codegen + openapi-typescript) then a
    # git-diff-exit-code gate. Drift fails the PR with its own red check
    # (separate from go-test / web-typecheck so cause is immediately visible).
    #
    # Steps order (LOCKED by D-48):
    #   1. checkout
    #   2. setup-go + setup-node (parallel installs, no DAG savings here but
    #      keeps the job self-contained — D-47 explicit requirement)
    #   3. pnpm install (frozen-lockfile)
    #   4. Redocly lint openapi.yaml — BEFORE codegen (D-48). Spec must be
    #      valid before regen.
    #   5. install task CLI (same pin as compose-config)
    #   6. task gen — runs sqlc + go generate ./... + pnpm -F @open-routing/ui gen:api
    #   7. git diff --exit-code — any drift fails the job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go side: oapi-codegen via `go generate ./...`
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      # Node side: openapi-typescript + Redocly CLI (npx-invoked, no
      # package.json dep — D-48)
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      # D-48: Redocly lint BEFORE codegen. Pinned to a specific version
      # (NEVER @latest, per ASVS V14.3 comment at top of file).
      - name: redocly lint openapi.yaml
        run: npx --yes @redocly/cli@1.25.0 lint openapi/openapi.yaml --extends recommended
      - name: install task CLI
        run: go install github.com/go-task/task/v3/cmd/task@v3.40.0
      # REVIEWS HIGH #1: sqlc must be installed before `task gen` because
      # Taskfile.yml:21 runs `sqlc generate` as the first codegen step.
      # GitHub runners do not ship with sqlc; without this step the
      # codegen-drift job fails on any runner that has not pre-cached it.
      # Pin matches the version the committed generated code was produced with
      # (the v0.1.x files + v0.2 regen are sqlc v1.31.1); a stale pin makes the
      # version-header comment drift and fails this gate.
      - name: install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      # D-47: run codegen via the canonical entry point so the CI behavior
      # matches local `task gen`. Sqlc is part of the chain too — sqlc on
      # the Phase 1 surface should be a no-op, but running it keeps the
      # full pipeline exercised.
      - name: task gen
        run: $(go env GOPATH)/bin/task gen
      # D-47: any diff means the committed generated code does not match
      # what the spec produces.
      - name: git diff codegen output
        run: |
          git diff --exit-code -- services/api/internal/api/ web/packages/ui/src/api/generated.ts

  validators-drift:
    # Phase 6 D6-31: ajv validator drift gate.
    # Regenerates validators from openapi.yaml and fails if any committed
    # validator files differ from the freshly generated output.
    # Mirrors the gen:api drift gate from Phase 2 D-47, extended for Phase 6.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Regenerate API types
        working-directory: web
        run: pnpm --filter @open-routing/ui gen:api
      - name: Gen validators drift gate
        working-directory: web
        run: pnpm --filter @open-routing/ui gen:validators
      - name: git diff validators output
        run: |
          git diff --exit-code -- web/packages/ui/src/api/generated.ts web/packages/ui/src/validators/

  admin-build-smoke:
    # Phase 6 D6-31: production Vite build check for the admin SPA.
    # Catches Lit decorator / SSR misconfigs and import resolution failures
    # before they reach a deployment. Runs after the UI package is set up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Admin production build smoke
        working-directory: web
        run: pnpm --filter @open-routing/admin build

  web-bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build embed bundle
        working-directory: web
        run: pnpm --filter @open-routing/catalog-embed build
      - name: Check embed gzip budget
        working-directory: web
        run: |
          set -o pipefail
          pnpm --filter @open-routing/catalog-embed size | tee embed-size-report.txt
          cat embed-size-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke packed embed package
        working-directory: web
        run: pnpm --filter @open-routing/catalog-embed pack:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: embed-size-report
          path: web/embed-size-report.txt

  web-embed-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        working-directory: web
        run: pnpm --filter @open-routing/catalog-embed exec playwright install --with-deps chromium
      - name: Build embed bundle
        working-directory: web
        run: pnpm --filter @open-routing/catalog-embed build
      - name: Embed Playwright matrix
        working-directory: web
        run: pnpm --filter @open-routing/catalog-embed test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-playwright-report
          path: |
            web/apps/embed/playwright-report/
            web/apps/embed/test-results/
