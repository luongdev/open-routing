# infra has default-deny-ingress; this mirrors allow-opentts-to-data so
# open-routing pods can reach the shared postgres (5432) + redis (6379).
# Lives in the infra namespace (that's where the data pods + deny policy are).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-open-routing-to-data
  namespace: infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-routing
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
