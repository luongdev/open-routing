apiVersion: v1
kind: Namespace
metadata:
  name: open-routing
---
# Control plane: REST API (cmd/api). DATABASE_URL is pgx keyword/value form so
# the password (from the copied infra secret) is taken literally — no URL
# encoding of special chars. Talks to infra postgres/redis by service DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-routing-api
  namespace: open-routing
  labels: { app: open-routing, plane: control }
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-routing-api }
  template:
    metadata:
      labels: { app: open-routing-api, plane: control }
    spec:
      containers:
        - name: api
          image: open-routing/api:v0.2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-secret, key: REDIS_PASSWORD } }
            - name: DATABASE_URL
              value: "host=postgres.infra.svc.cluster.local port=5432 user=opentts password=$(POSTGRES_PASSWORD) dbname=openrouting sslmode=disable"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.infra.svc.cluster.local:6379/0"
            - name: LISTEN_ADDR
              value: ":8080"
            - name: OTEL_EXPORTER
              value: "stdout"
            - name: ORGDB_VALIDATION_MODE
              value: "error"
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: open-routing-api
  namespace: open-routing
spec:
  selector: { app: open-routing-api }
  ports:
    - port: 8080
      targetPort: 8080
---
# Runtime plane (cmd/runtime). v0.2 scaffold — boots config/db/registry then
# idles on signal (the worker lands in Layer 3). Deployed to prove the two-plane
# split and that its config/DB wiring is correct.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-routing-runtime
  namespace: open-routing
  labels: { app: open-routing, plane: runtime }
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-routing-runtime }
  template:
    metadata:
      labels: { app: open-routing-runtime, plane: runtime }
    spec:
      containers:
        - name: runtime
          image: open-routing/api:v0.2
          imagePullPolicy: Never
          command: ["/usr/local/bin/runtime"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-secret, key: REDIS_PASSWORD } }
            - name: DATABASE_URL
              value: "host=postgres.infra.svc.cluster.local port=5432 user=opentts password=$(POSTGRES_PASSWORD) dbname=openrouting sslmode=disable"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.infra.svc.cluster.local:6379/0"
            - name: OTEL_EXPORTER
              value: "stdout"
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
# Web admin SPA + nginx reverse-proxy to the api (same origin). Exposed via
# NodePort (cluster has no ingress controller).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-routing-web
  namespace: open-routing
  labels: { app: open-routing, plane: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-routing-web }
  template:
    metadata:
      labels: { app: open-routing-web, plane: web }
    spec:
      containers:
        - name: web
          image: open-routing/web:v0.2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: open-routing-web
  namespace: open-routing
spec:
  type: NodePort
  selector: { app: open-routing-web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
