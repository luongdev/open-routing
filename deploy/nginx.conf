# Serves the built admin SPA and reverse-proxies the API surface so the browser
# talks to one origin (no CORS). Mirrors the vite dev proxy (/v1,/healthz,/readyz
# -> :8080). The resolver + variable upstream defer DNS to request time, so nginx
# starts even before the api Deployment is ready.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 10.43.0.10 valid=10s;
  set $api_upstream "open-routing-api.open-routing.svc.cluster.local:8080";

  location /v1/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /healthz     { proxy_pass http://$api_upstream; }
  location = /readyz      { proxy_pass http://$api_upstream; }
  location = /openapi.yaml { proxy_pass http://$api_upstream; }
  location /docs          { proxy_pass http://$api_upstream; }
  location = /metrics     { proxy_pass http://$api_upstream; }

  # SPA client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
