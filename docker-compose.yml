services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openrouting
      POSTGRES_USER: openrouting
      POSTGRES_PASSWORD: openrouting   # dev only; never used in prod
    ports:
      - "5432:5432"
    volumes:
      - openrouting_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrouting -d openrouting"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  openrouting_pg_data:
