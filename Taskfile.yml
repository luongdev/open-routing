# Taskfile.yml — top-level orchestrator (D-08)
# Target list is LOCKED. Do not rename or add targets without user approval.
# D-11: API never auto-runs migrations; devs invoke `task migrate-up` explicitly.

version: '3'

env:
  DATABASE_URL: 'postgres://openrouting:openrouting@localhost:5432/openrouting?sslmode=disable'
  REDIS_URL: 'redis://localhost:6379/0'
  GOLANGCI_LINT_VERSION: 'v2.4.0'

tasks:
  default:
    cmds:
      - task: --list

  # ---- Codegen ----
  gen:
    desc: Run sqlc + (Phase 2) oapi-codegen + openapi-typescript
    cmds:
      # Phase 2: add oapi-codegen + openapi-typescript
      - cd services/api && sqlc generate

  # ---- Migrations (D-08 + D-11) ----
  migrate-up:
    desc: Apply all pending migrations
    cmds:
      - migrate -path migrations -database "$DATABASE_URL" up

  migrate-down:
    desc: Roll back the latest migration (D-08 — exactly one)
    cmds:
      - migrate -path migrations -database "$DATABASE_URL" down 1

  migrate-create:
    desc: 'Create a new migration. Use NAME=<snake_case_name>.'
    cmds:
      - migrate create -ext sql -dir migrations -seq {{.NAME}}
    requires:
      vars: [NAME]

  # ---- Dev (D-24 flow) ----
  dev:
    desc: Bring up infra (postgres + redis) and run API with air hot-reload
    cmds:
      - docker compose up -d postgres redis
      - cd services/api && air -c .air.toml

  # ---- Test ----
  test:
    desc: Run all Go tests with race detector
    cmds:
      - cd services/api && go test -race -count=1 ./...

  test:quick:
    desc: Run short tests in internal/* only (VALIDATION sampling)
    cmds:
      - cd services/api && go test -count=1 -short ./internal/...

  # ---- Lint ----
  lint:
    desc: Run go vet + golangci-lint + pnpm lint
    cmds:
      - cd services/api && go vet ./...
      - |
        mkdir -p .task/bin
        if ! .task/bin/golangci-lint version 2>/dev/null | grep -q "version ${GOLANGCI_LINT_VERSION#v}"; then
          GOBIN="$PWD/.task/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
        fi
        cd services/api && ../../.task/bin/golangci-lint run
      - cd web && pnpm -F '*' lint

  # ---- Typecheck (web only — Go side is covered by go vet in lint) ----
  typecheck:
    desc: Typecheck the web pnpm workspace
    cmds:
      - cd web && pnpm -F '*' typecheck

  # ---- CI (D-30 composition) ----
  ci:
    desc: Run the same checks CI runs (lint + typecheck + test sequentially)
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  # ---- Build ----
  build:
    desc: Build the API + migrate binaries into ./bin/
    cmds:
      - cd services/api && go build -o ../../bin/api ./cmd/api
      - cd services/api && go build -o ../../bin/migrate ./cmd/migrate
