version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - gocritic
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
      - path: internal/db/generated/
        linters: [gosec, errcheck, gocritic, staticcheck]
      - path: internal/api/
        linters: [gosec, errcheck, gocritic, staticcheck]
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
