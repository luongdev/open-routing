          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Channels
      operationId: UpdateChannel
      summary: Update a channel
      description: >
        Partial update of a channel. Include `version` from the last GET
        response for optimistic concurrency (CAT-08, OQ-1/A4). A mismatch
        returns HTTP 409 with the current server-side record in the body.
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Channel updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Optimistic-concurrency conflict (D-37, ErrorCode=version_conflict)
            with the current server-side channel record returned in `current`,
            OR a uniqueness collision raised by a PATCH that supplied an
            external_id already bound to another channel in the org
            (ErrorCode=duplicate_external_id; Phase 5 fix H1). Clients should
            branch on ErrorCode, not parse the description text.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - allOf:
                      - $ref: "#/components/schemas/VersionConflictErrorResponse"
                      - type: object
                        properties:
                          current:
                            $ref: "#/components/schemas/Channel"
        "422":
          description: |
            Business-rule violation. ErrorCode disambiguates: (a)
            `immutable_field` — PATCH attempted to change a field that is
            immutable in v0.1 (e.g., `code`; rename support deferred to
            v0.2 per D04_1-02); (b) `invalid_reference` — the supplied
            `default_queue_id` does not exist (or is disabled) in the
            caller's org. The `field` slot in ErrorResponse identifies
            which request body path failed (e.g. `code` or `default_queue_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Channels
      operationId: DeleteChannel
      summary: Soft-delete a channel
      security:
        - OrgHeader: []
      responses:
        "204":
          description: Channel disabled.
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

