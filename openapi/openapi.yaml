openapi: 3.0.0

info:
  title: Open Routing API
  version: 0.2.0
  description: |
    REST management API for Open Routing — an embeddable, multi-channel routing
    platform. All catalog CRUD, agent state transitions, bulk import, and
    infrastructure endpoints are defined here.

    ## Multi-Org Isolation

    Every endpoint under `/v1/orgs/{org_id}/` is gated by the `OrgContext`
    middleware. Pass the organization's UUIDv7 in the `X-Org-Id` request header.
    The path parameter `{org_id}` is present for REST semantics but the
    authoritative value is always taken from the header (FOUND-03, FOUND-05).

    ## Error Envelope (D-35, D-36)

    All error responses use a canonical JSON shape:

    ```json
    { "error": "<ErrorCode>", "reason": "<detail>", "request_id": "<uuidv7>" }
    ```

    The `error` field is a closed enum (see `ErrorCode` schema). The
    `request_id` field is the per-request UUIDv7 minted by the `RequestID`
    middleware; it is omitted on bypass routes that run before the middleware.

    ## UUID Convention (D-19, D-20)

    All IDs (primary keys, `org_id`, foreign keys) are UUIDv7 or higher.
    UUIDv4 and lower are rejected with `HTTP 400 / invalid_id`.

    ## Pagination (CAT-10)

    List endpoints use cursor-based pagination. The cursor is an opaque
    base64-encoded composite of `{created_at, id}`. Pass `next_cursor` from
    the previous response as `?cursor=<token>` to fetch the next page.

    ## Spec version

    This spec describes the v0.1 Catalog Foundation milestone. Catalog
    CRUD endpoints live under the `/v1/orgs/{org_id}/` prefix.

    ## Identity Model

    Catalog entities use `code` (lowercase, `^[a-z][a-z0-9_]{0,63}$`) as the
    user-facing canonical identifier (D04_1-01). `code` is required on every
    primary entity (agents, skills, queues, channels, adapters,
    break_reasons), composite-unique within an org, and immutable
    post-create in v0.1 (D04_1-02 — rename support deferred to v0.2 via a
    dedicated rename endpoint). `external_id` is demoted to an OPTIONAL
    integration-mapping field with partial unique `(org_id, external_id)
    WHERE external_id IS NOT NULL` (D04_1-06). Cross-AI peer-review design
    rationale: `.planning/phases/03-catalog-crud-go/03-CATALOG-IDENTITY-REVIEW.md`
    and the response artifact `03-CATALOG-IDENTITY-REVIEW-RESPONSE.md`.

  contact:
    name: Open Routing
    url: https://github.com/luongdev/open-routing
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /
    description: Same-origin (relative base)
  - url: http://localhost:8080
    description: Local development

# ─── Security Schemes ─────────────────────────────────────────────────────────
# D-21: stub auth in v0.1. X-Org-Id acts as the org bearer token.
# Real JWT auth arrives in v1 AUTH-01. The scheme name "OrgHeader" is used
# on every path under /v1/ (applied via the global security block below each
# path group).

components:
  securitySchemes:
    OrgHeader:
      type: apiKey
      in: header
      name: X-Org-Id
      description: |
        UUIDv7 identifying the organization. Required on all `/v1/` endpoints.
        (FOUND-08) The `{org_id}` path segment is decorative — the middleware
        reads the header exclusively; mismatches between path and header values
        always use the header value. Description: The `{org_id}` path parameter
        mirrors the header for REST semantics but the authoritative `org_id` for
        database scoping is always read from `X-Org-Id`. This prevents
        cross-org data leakage when a hostile client edits the URL (FOUND-08
        OrgIdPath leakage guard).

# ─── Reusable Schemas ─────────────────────────────────────────────────────────

  schemas:

    # ── Expression DSL catalog ───────────────────────────────────────────────────

    ExprFunction:
      type: object
      description: One condition-DSL function (str.*, num.*, arr.*, logic.*, date.*).
      required:
        - ns
        - name
        - arity
        - signature
        - summary
      properties:
        ns:
          type: string
          example: str
        name:
          type: string
          example: upper
        arity:
          type: integer
          description: Fixed argument count, or -1 for variadic.
          example: 1
        signature:
          type: string
          example: "str.upper(s) -> string"
        summary:
          type: string
          example: Uppercase

    ExprFunctionCatalog:
      type: object
      required:
        - functions
      properties:
        functions:
          type: array
          items:
            $ref: "#/components/schemas/ExprFunction"

    # ── Identifiers ────────────────────────────────────────────────────────────

    UUIDv7:
      type: string
      format: uuid
      description: |
        A UUIDv7 (RFC 9562 §5.7) time-ordered unique identifier.
        Version must be 7 or higher; UUIDv4 and lower are rejected.
        Example: `01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e`
      example: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    # ── Error Envelope ─────────────────────────────────────────────────────────

    ErrorCode:
      type: string
      description: |
        Closed enum of machine-readable error codes (D-36, D-75, ROADMAP Phase 3
        criterion 4). Clients branch on this value — never on `reason` or HTTP
        status alone.

        Phase 04.1 added `duplicate_code`, `duplicate_external_id`, and
        `immutable_field` to support the universal `code` identity model
        (D04_1-16, D04_1-20).
      enum:
        - invalid_body
        - invalid_id
        - not_found
        - internal
        - version_conflict
        - cross_org
        - duplicate_code
        - duplicate_external_id
        - invalid_org_id
        - invalid_transition
        - import_failed
        - immutable_field
        - rate_limited
        - invalid_reference
        - invalid_value

    ErrorResponse:
      type: object
      description: |
        Canonical error envelope (D-35). Present on every 4xx/5xx response.
        `request_id` is omitted on bypass routes that run before the RequestID
        middleware (e.g. responses from the OrgContext middleware itself for
        missing/malformed X-Org-Id).
      required:
        - error
        - reason
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        reason:
          type: string
          description: >
            Human-readable contextual detail for debugging. Clients MUST NOT
            branch on this value — it is subject to change across minor versions.
          example: "missing_header"
        request_id:
          $ref: "#/components/schemas/UUIDv7"
          description: >
            Per-request UUIDv7 minted by the RequestID middleware. Embedded in
            error bodies for support DX — users include this in bug reports.
            Absent when the response is emitted before the RequestID middleware
            runs (bypass routes, middleware-reject paths).

    # ── D-37 Special-Case Error Extensions ─────────────────────────────────────

    VersionConflictErrorResponse:
      type: object
      description: |
        HTTP 409 response for optimistic concurrency mismatches (CAT-08, D-37).
        Extends the canonical error envelope with `current` — the server-side
        record as of the moment of the conflict. The UI uses `current` to show
        a diff/merge affordance so the user can see what changed.
      required:
        - error
        - reason
        - current
      properties:
        error:
          type: string
          enum:
            - version_conflict
        reason:
          type: string
          example: "version_mismatch"
        request_id:
          $ref: "#/components/schemas/UUIDv7"
        current:
          description: >
            The complete server-side entity record at the time of the conflict.
            Schema depends on which entity was being updated — see per-entity
            response schemas.

    InvalidTransitionErrorResponse:
      type: object
      description: |
        HTTP 409 response for invalid agent-state transitions (STATE-03, D-37).
        Extends the canonical error envelope with `from` and `to` — the
        requested state pair that is not in the allowed transition matrix.
      required:
        - error
        - reason
        - from
        - to
      properties:
        error:
          type: string
          enum:
            - invalid_transition
        reason:
          type: string
          example: "not_in_allowed_matrix"
        request_id:
          $ref: "#/components/schemas/UUIDv7"
        from:
          $ref: "#/components/schemas/AgentStatus"
        to:
          $ref: "#/components/schemas/AgentStatus"

    # ── Pagination ─────────────────────────────────────────────────────────────

    PaginatedList:
      type: object
      description: |
        Common cursor-based pagination envelope (CAT-10). Reused across all
        six catalog entity list endpoints via `allOf` with an entity-specific
        `items` property override.

        The cursor is an opaque base64-encoded composite of `{created_at, id}`.
        Cursor internals are not part of the public contract — clients MUST
        treat it as an opaque string. Do not parse or construct cursor values.
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          description: The current page of results.
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque base64 cursor for the next page. `null` when this is the
            last page. Pass as `?cursor=<value>` on the next request.
          example: "eyJjcmVhdGVkX2F0IjoiMjAyNi0wNS0xNVQwMDowMDowMFoiLCJpZCI6IjAxOTAxYjJjLTdmM2EtN2FiYy04ZDRlLTVmNmE3YjhjOWQwZSJ9"
        has_more:
          type: boolean
          description: >
            `true` when there are more results beyond this page.
            Prefer `has_more` over checking `next_cursor != null` for clarity.

    # ── Catalog Entity Schemas ─────────────────────────────────────────────────

    # Agent (CAT-01, CAT-03)
    AgentSkillAssignment:
      type: object
      description: A skill assigned to an agent with a proficiency rating.
      required:
        - skill_id
        - proficiency
      properties:
        skill_id:
          $ref: "#/components/schemas/UUIDv7"
          description: The skill being assigned.
        name:
          type: string
          description: Skill name — included on GET detail responses, omitted on write bodies.
          readOnly: true
          example: "Billing Support"
        proficiency:
          type: integer
          description: >
            Agent proficiency rating on this skill. Inclusive range 1
            (beginner) to 10 (expert). The OpenAPI schema intentionally
            omits `minimum`/`maximum` so the oapi-codegen Layer 1 validator
            does NOT short-circuit out-of-range values with HTTP 400. The
            handler (catalog package, Plan 03-09) enforces the 1-10 range
            and returns HTTP 422 with `ErrorCode=invalid_value` when the
            value is out of range — see ROADMAP Phase 3 success criterion 4.
            Clients should still display min=1/max=10 in UI to prevent
            obvious mistakes; the wire shape distinguishes "wrong value"
            (422 invalid_value) from "wrong type" (400 invalid_body).
          example: 8

    Agent:
      type: object
      description: >
        An agent in the catalog. Agents are the humans (or bots) who handle
        routed interactions. Each agent belongs to exactly one org.
      required:
        - id
        - org_id
        - code
        - name
        - email
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
          description: Server-minted UUIDv7 primary key.
        org_id:
          $ref: "#/components/schemas/UUIDv7"
          description: The org this agent belongs to.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier (D04_1-01). Required, immutable
            after create. Composite UNIQUE (org_id, code). Used as the upsert
            key for bulk import (Phase 5) and cross-reference target for
            nested relationships and future DSL references.
          example: emp_0042
        external_id:
          type: string
          nullable: true
          description: |
            Optional caller-assigned identifier from an external system
            (HR, CRM, etc.). Used for sync mapping only — NOT the upsert
            key for bulk import (use `code` for that). Partial unique
            within an org when present. v0.1 supports at most one
            external source per entity per org; multi-source
            disambiguation deferred to v0.2 via `external_source TEXT`.
          example: HR-EMP-0042
        name:
          type: string
          description: Display name of the agent.
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          description: Agent email address.
          example: "alice@example.com"
        enabled:
          type: boolean
          description: >
            Soft-delete flag. `false` means the agent is disabled and will not
            appear in default list responses (CAT-09). Use `?include_disabled=true`
            to surface disabled agents.
          example: true
        version:
          type: integer
          description: >
            Monotonically increasing optimistic-lock version counter (CAT-08).
            Must be included in `PATCH` requests; mismatch returns HTTP 409.
          example: 1
        skills:
          type: array
          description: >
            Skills assigned to this agent with proficiency ratings. Embedded
            on detail GET responses only; omitted from list responses (CAT-10
            list items are flat, OQ-1A). Not present on create/list responses.
          items:
            $ref: "#/components/schemas/AgentSkillAssignment"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    AgentListItem:
      type: object
      description: >
        Flat agent record returned in list responses. Skills are intentionally
        omitted (OQ-1A resolution — embed skills only on detail responses).
      required:
        - id
        - org_id
        - code
        - name
        - email
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier (D04_1-01). Required, immutable
            after create. Composite UNIQUE (org_id, code). Used as the upsert
            key for bulk import (Phase 5) and cross-reference target for
            nested relationships and future DSL references.
          example: emp_0042
        external_id:
          type: string
          nullable: true
          description: |
            Optional caller-assigned identifier from an external system
            (HR, CRM, etc.). Used for sync mapping only — NOT the upsert
            key for bulk import (use `code` for that). Partial unique
            within an org when present. v0.1 supports at most one
            external source per entity per org; multi-source
            disambiguation deferred to v0.2 via `external_source TEXT`.
          example: HR-EMP-0042
        name:
          type: string
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          example: "alice@example.com"
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateAgentRequest:
      type: object
      description: Request body for creating an agent.
      required:
        - code
        - name
        - email
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier. Required on create, immutable
            after (passing a different code in PATCH returns HTTP 422 with
            ErrorCode=immutable_field).
          example: emp_0042
        external_id:
          type: string
          nullable: true
          description: Optional caller-assigned identifier from an external system. See entity schema.
          example: HR-EMP-0042
        name:
          type: string
          description: Display name.
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          description: Agent email address.
          example: "alice@example.com"
        enabled:
          type: boolean
          description: Initial enabled state. Defaults to `true`.
          default: true
        skills:
          type: array
          description: Initial skill assignments. Omit to create with no skills.
          items:
            $ref: "#/components/schemas/AgentSkillAssignment"

    UpdateAgentRequest:
      type: object
      description: >
        Request body for updating an agent. Include `version` from the last
        GET response for optimistic concurrency (CAT-08).
      required:
        - version
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            Must equal the stored value (immutable post-create in v0.1, D04_1-02).
            Passing a different value returns HTTP 422 with
            ErrorCode=immutable_field. The field is accepted in the PATCH
            body to preserve symmetry with the Create*Request shape; absent
            or matching values are no-ops. Rename support deferred to v0.2.
          example: emp_0042
        external_id:
          type: string
          nullable: true
          description: |
            Mutable external-system mapping (D04_1-07). Pass a non-empty
            string to (re)bind to an external row; pass an empty string
            `""` to CLEAR the binding (server sets external_id to SQL NULL);
            omit the field to leave the existing binding unchanged. Phase 5
            fix H2 — `null` JSON values are indistinguishable from omission
            in the current oapi-codegen pointer encoding (both decode to a
            nil `*string`), so the empty-string sentinel is the documented
            v0.1 way to clear. A future v0.2 release may add a tri-state
            wrapper that allows literal `null` to clear, at which point the
            empty-string sentinel will be deprecated but still honoured.
          example: HR-EMP-0042
        name:
          type: string
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          example: "alice@example.com"
        enabled:
          type: boolean
        version:
          type: integer
          description: Current optimistic-lock version. Mismatch → HTTP 409.
          example: 1
        skills:
          type: array
          description: >
            Full-replacement skill assignment array (PUT semantics on the join
            table — OQ-1A resolution). Replaces the entire set atomically. Omit
            to leave skills unchanged.
          items:
            $ref: "#/components/schemas/AgentSkillAssignment"

    # Skill (CAT-02)
    Skill:
      type: object
      description: A skill in the catalog. Skills are assigned to agents with a proficiency rating.
      required:
        - id
        - org_id
        - code
        - name
        - skill_type
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier (D04_1-01). Required, immutable
            after create. Composite UNIQUE (org_id, code). Used as the upsert
            key for bulk import (Phase 5) and cross-reference target for
            nested relationships and future DSL references.
          example: skill_voice_tier1
        external_id:
          type: string
          nullable: true
          description: |
            Optional caller-assigned identifier from an external system
            (HR, CRM, etc.). Used for sync mapping only — NOT the upsert
            key for bulk import (use `code` for that). Partial unique
            within an org when present. v0.1 supports at most one
            external source per entity per org; multi-source
            disambiguation deferred to v0.2 via `external_source TEXT`.
          example: HR-SKILL-VOICE
        name:
          type: string
          example: "Billing Support"
        description:
          type: string
          nullable: true
          description: Optional long-form description.
          example: "Handle billing inquiries, refunds, and payment disputes."
        skill_type:
          type: string
          description: >
            Category or domain of the skill (e.g. "technical", "language",
            "product"). Free text — the platform does not restrict values.
          example: "support"
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateSkillRequest:
      type: object
      required:
        - code
        - name
        - skill_type
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier. Required on create, immutable
            after (passing a different code in PATCH returns HTTP 422 with
            ErrorCode=immutable_field).
          example: skill_voice_tier1
        external_id:
          type: string
          nullable: true
          description: Optional caller-assigned identifier from an external system. See entity schema.
          example: HR-SKILL-VOICE
        name:
          type: string
          example: "Billing Support"
        description:
          type: string
          nullable: true
          example: "Handle billing inquiries and payment disputes."
        skill_type:
          type: string
          example: "support"
        enabled:
          type: boolean
          default: true

    UpdateSkillRequest:
      type: object
      required:
        - version
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            Must equal the stored value (immutable post-create in v0.1, D04_1-02).
            Passing a different value returns HTTP 422 with
            ErrorCode=immutable_field. The field is accepted in the PATCH
            body to preserve symmetry with the Create*Request shape; absent
            or matching values are no-ops. Rename support deferred to v0.2.
          example: skill_voice_tier1
        external_id:
          type: string
          nullable: true
          description: |
            Mutable external-system mapping (D04_1-07). Pass a non-empty
            string to (re)bind to an external row; pass an empty string
            `""` to CLEAR the binding (server sets external_id to SQL NULL);
            omit the field to leave the existing binding unchanged. Phase 5
            fix H2 — `null` JSON values are indistinguishable from omission
            in the current oapi-codegen pointer encoding (both decode to a
            nil `*string`), so the empty-string sentinel is the documented
            v0.1 way to clear. A future v0.2 release may add a tri-state
            wrapper that allows literal `null` to clear, at which point the
            empty-string sentinel will be deprecated but still honoured.
          example: HR-SKILL-VOICE
        name:
          type: string
          example: "Billing Support"
        description:
          type: string
          nullable: true
        skill_type:
          type: string
          example: "support"
        enabled:
          type: boolean
        version:
          type: integer
          description: Optimistic-lock version. Mismatch → HTTP 409.
          example: 1

    # Queue (CAT-04)
    Flow:
      type: object
      description: >
        A routing flow draft. The graph is the canonical authoring artifact
        (UI graph is the source of truth). `version` is the optimistic-lock
        revision of the draft, distinct from the immutable published versions.
      required:
        - id
        - org_id
        - code
        - name
        - graph
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: User-facing canonical identifier. Required, immutable after create. Composite UNIQUE (org_id, code).
          example: flow_inbound_voice
        name:
          type: string
          example: "Inbound Voice"
        graph:
          type: object
          additionalProperties: true
          description: >
            Canonical flow graph (nodes + edges). Opaque pass-through in
            Stage 1; structurally validated before simulation and publish.
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-06-02T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-06-02T00:00:00Z"

    CreateFlowRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          example: flow_inbound_voice
        name:
          type: string
          example: "Inbound Voice"
        graph:
          type: object
          additionalProperties: true
          description: Initial flow graph. Defaults to an empty graph when omitted.
        enabled:
          type: boolean
          default: true

    UpdateFlowRequest:
      type: object
      required:
        - version
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: >
            Must equal the stored value (immutable post-create). A different
            value returns HTTP 422 with ErrorCode=immutable_field.
        name:
          type: string
        graph:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        version:
          type: integer
          description: Expected current version for optimistic concurrency.

    RoutingFailureCode:
      type: string
      description: Typed taxonomy of routing failures recorded on a route request and its trace.
      enum:
        - missing_published_flow
        - missing_catalog_reference
        - no_eligible_candidate
        - multiple_active_bindings
        - invalid_graph
        - reservation_transition_conflict
        - loop_limit
        - invalid_loop_input

    FlowEntryBinding:
      type: object
      description: Maps a route entry point (channel + entry code) to its active published flow version.
      required:
        - id
        - org_id
        - channel
        - entry_code
        - flow_version_id
        - flow_code
        - active
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        channel:
          type: string
        entry_code:
          type: string
        flow_version_id:
          $ref: "#/components/schemas/UUIDv7"
        flow_code:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    FlowPublishResult:
      type: object
      description: The immutable version created/re-activated plus the binding it activated.
      required:
        - version
        - binding
      properties:
        version:
          $ref: "#/components/schemas/FlowVersion"
        binding:
          $ref: "#/components/schemas/FlowEntryBinding"

    SimulateScriptedReservationOutcome:
      type: object
      description: >
        A scripted reservation outcome for deterministic simulation. With
        `node_id` set it pins THAT reservation node's result port directly
        (per-node, order-independent). Without `node_id`, entries form an ordered
        per-offer queue (legacy).
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum: [accepted, rejected, timeout, no_candidate]
        node_id:
          type: string
          description: When set, this outcome is the result port of that reservation node.
        agent_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"

    FlowVersion:
      type: object
      description: >
        An immutable published version of a flow, created by publish. Route
        requests pin a flow_version_id at start; traces reference it.
      required:
        - id
        - org_id
        - flow_id
        - flow_code
        - version_number
        - graph
        - plan_format_version
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        flow_id:
          $ref: "#/components/schemas/UUIDv7"
        flow_code:
          type: string
          example: flow_inbound_voice
        version_number:
          type: integer
          example: 1
        graph:
          type: object
          additionalProperties: true
          description: Immutable snapshot of the authored graph at publish time.
        plan_format_version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true

    FlowValidationIssue:
      type: object
      description: One validation problem, located at a node, edge, or field.
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: missing_catalog_reference
        message:
          type: string
        node_id:
          type: string
          nullable: true
        edge_id:
          type: string
          nullable: true
        field:
          type: string
          nullable: true

    FlowValidationResult:
      type: object
      required:
        - valid
        - issues
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/FlowValidationIssue"

    PublishFlowRequest:
      type: object
      description: Publish the current draft graph as an immutable version and activate it for a route entry point.
      required:
        - channel
        - entry_code
        - version
      properties:
        channel:
          type: string
          example: voice
        entry_code:
          type: string
          example: main
        version:
          type: integer
          description: Expected current draft version (optimistic concurrency against the draft being published).
        expected_current_flow_version_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          description: If set, publish only proceeds when the binding's current active version matches (guards against concurrent publish/rollback clobber).

    RollbackFlowRequest:
      type: object
      description: Re-activate a prior published version for a route entry point.
      required:
        - channel
        - entry_code
        - to_version_number
      properties:
        channel:
          type: string
          example: voice
        entry_code:
          type: string
          example: main
        to_version_number:
          type: integer
          example: 1
        expected_current_flow_version_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          description: If set, rollback only proceeds when the binding's current active version matches (guards against concurrent clobber).

    SimulateFlowRequest:
      type: object
      description: >
        Deterministic simulation of the draft graph against synthetic input.
        Does not mutate live reservations or agent state.
      required:
        - interaction_input
      properties:
        interaction_input:
          type: object
          additionalProperties: true
        channel:
          type: string
          example: voice
        entry_code:
          type: string
          example: main
        virtual_clock_start:
          type: string
          format: date-time
          description: Pins the simulator's virtual clock start so wait/timeout paths replay deterministically.
        scripted_reservation_outcomes:
          type: array
          description: Reservation outcomes applied in order so offers resolve deterministically.
          items:
            $ref: "#/components/schemas/SimulateScriptedReservationOutcome"
        scripted_effect_outputs:
          type: object
          additionalProperties: true
          description: Recorded/mocked effect-node outputs keyed by node id.

    TraceStep:
      type: object
      required:
        - index
        - node_id
        - node_kind
        - status
      properties:
        index:
          type: integer
        node_id:
          type: string
        node_kind:
          type: string
        status:
          type: string
          enum: [ok, error, skipped, suspended]
        port:
          type: string
          nullable: true
          description: The output port the node took (e.g. true/false, accepted/timeout).
        input:
          type: object
          additionalProperties: true
          nullable: true
        output:
          type: object
          additionalProperties: true
          nullable: true
        catalog_refs:
          type: array
          items:
            type: string
        effect_status:
          type: string
          nullable: true
        duration_ms:
          type: number
          nullable: true
          description: Execution (CPU) time of the step in ms — NOT virtual wait time advanced by wait/reservation.
        error:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
          description: The id of the control-flow body region this step ran inside (loop/parallel/try_catch), if any.
        iteration:
          type: integer
          nullable: true
          description: Zero-based loop iteration index for steps inside a loop_for/loop_while body.
        branch:
          type: integer
          nullable: true
          description: Zero-based branch index for steps inside a parallel branch.
        caught:
          type: boolean
          nullable: true
          description: True when this step's domain failure was caught by an enclosing try_catch.

    Trace:
      type: object
      description: An ordered runtime or simulation trace explaining a routing outcome.
      required:
        - id
        - org_id
        - kind
        - steps
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        kind:
          type: string
          enum: [runtime, simulation]
        route_request_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
        flow_version_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
        flow_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          description: Set for simulation traces (which pin a draft, not a published version).
        outcome:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TraceStep"
        created_at:
          type: string
          format: date-time
          readOnly: true

    SimulateFlowResponse:
      type: object
      description: A simulation trace plus the resolved virtual clock start (so replay is exact even when the request omitted it).
      required:
        - virtual_clock_start
        - trace
      properties:
        virtual_clock_start:
          type: string
          format: date-time
          description: The virtual clock origin actually used (echoed from the request, or server-chosen when omitted).
        trace:
          $ref: "#/components/schemas/Trace"

    CreateRouteRequest:
      type: object
      description: Admin/test entry point to drive a route through the published flow for a channel + entry code.
      required:
        - channel
        - entry_code
      properties:
        channel:
          type: string
          example: voice
        entry_code:
          type: string
          example: main
        interaction_input:
          type: object
          additionalProperties: true

    SubmitRouteInput:
      type: object
      description: A captured value submitted to a route waiting at an interactive-input node.
      required:
        - value
      properties:
        node_id:
          type: string
          description: >
            The input node to answer. Optional — defaults to the node the route is
            currently parked at (its resume cursor).
        value:
          description: The captured value (digits, text, "approved"/"rejected", a survey score, …).

    RouteRequest:
      type: object
      description: The interaction spine — reservations, events, and traces reference it.
      required:
        - id
        - org_id
        - channel
        - entry_code
        - status
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        channel:
          type: string
        entry_code:
          type: string
        flow_version_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
        flow_code:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, running, waiting, waiting_match, offering, completed, failed, cancelled]
        failure_code:
          allOf:
            - $ref: "#/components/schemas/RoutingFailureCode"
        trace_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          description: The trace for this route request, once execution has produced one.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    RoutingStats:
      type: object
      description: Live matcher/queue snapshot for an org — for the ops view.
      required:
        - waiting_match
        - offering
        - waiting_offer
        - oldest_waiting_seconds
        - held_slots
      properties:
        waiting_match:
          type: integer
          description: Routes parked in the queue waiting for an available agent.
        offering:
          type: integer
          description: Routes the matcher has claimed and is building an offer for (transient).
        waiting_offer:
          type: integer
          description: Routes with an outstanding offer awaiting an agent accept/reject.
        oldest_waiting_seconds:
          type: integer
          description: SLA age (seconds) of the oldest queued route; 0 when the queue is empty.
        held_slots:
          type: integer
          description: Capacity slots currently held (pending offers + confirmed live calls).

    Reservation:
      type: object
      description: An offer of a route request to an agent, with its lifecycle state.
      required:
        - id
        - org_id
        - route_request_id
        - agent_id
        - state
        - attempt
        - offered_at
        - expires_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        route_request_id:
          $ref: "#/components/schemas/UUIDv7"
        agent_id:
          $ref: "#/components/schemas/UUIDv7"
        state:
          type: string
          enum: [offered, accepted, rejected, timeout, cancelled, completed]
        attempt:
          type: integer
        offered_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Queue:
      type: object
      description: >
        A queue in the catalog. Queues hold interactions waiting to be assigned
        to an agent. Queues have a channel type, priority, and an after-contact
        work (ACW) timer.
      required:
        - id
        - org_id
        - code
        - name
        - channel_types
        - priority
        - acw_sec
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier (D04_1-01). Required, immutable
            after create. Composite UNIQUE (org_id, code). Used as the upsert
            key for bulk import (Phase 5) and cross-reference target for
            nested relationships and future DSL references.
          example: queue_billing
        external_id:
          type: string
          nullable: true
          description: |
            Optional caller-assigned identifier from an external system
            (HR, CRM, etc.). Used for sync mapping only — NOT the upsert
            key for bulk import (use `code` for that). Partial unique
            within an org when present. v0.1 supports at most one
            external source per entity per org; multi-source
            disambiguation deferred to v0.2 via `external_source TEXT`.
          example: CRM-Q-BILLING
        name:
          type: string
          example: "Billing Queue"
        channel_types:
          type: array
          description: Channel types this queue accepts (e.g. ["voice", "chat"]).
          items:
            $ref: "#/components/schemas/ChannelType"
          minItems: 1
        priority:
          type: integer
          description: >
            Queue priority. Higher values indicate higher priority. Used by the
            routing engine to break ties among equally-skilled agents.
          example: 5
        acw_sec:
          type: integer
          description: >
            After-contact work (ACW / WrapUp) timer in seconds. When an
            interaction ends, the agent enters WrapUp for this many seconds.
          example: 60
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateQueueRequest:
      type: object
      required:
        - code
        - name
        - channel_types
        - priority
        - acw_sec
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier. Required on create, immutable
            after (passing a different code in PATCH returns HTTP 422 with
            ErrorCode=immutable_field).
          example: queue_billing
        external_id:
          type: string
          nullable: true
          description: Optional caller-assigned identifier from an external system. See entity schema.
          example: CRM-Q-BILLING
        name:
          type: string
          example: "Billing Queue"
        channel_types:
          type: array
          items:
            $ref: "#/components/schemas/ChannelType"
          minItems: 1
        priority:
          type: integer
          example: 5
        acw_sec:
          type: integer
          example: 60
        enabled:
          type: boolean
          default: true

    UpdateQueueRequest:
      type: object
      required:
        - version
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            Must equal the stored value (immutable post-create in v0.1, D04_1-02).
            Passing a different value returns HTTP 422 with
            ErrorCode=immutable_field. The field is accepted in the PATCH
            body to preserve symmetry with the Create*Request shape; absent
            or matching values are no-ops. Rename support deferred to v0.2.
          example: queue_billing
        external_id:
          type: string
          nullable: true
          description: |
            Mutable external-system mapping (D04_1-07). Pass a non-empty
            string to (re)bind to an external row; pass an empty string
            `""` to CLEAR the binding (server sets external_id to SQL NULL);
            omit the field to leave the existing binding unchanged. Phase 5
            fix H2 — `null` JSON values are indistinguishable from omission
            in the current oapi-codegen pointer encoding (both decode to a
            nil `*string`), so the empty-string sentinel is the documented
            v0.1 way to clear. A future v0.2 release may add a tri-state
            wrapper that allows literal `null` to clear, at which point the
            empty-string sentinel will be deprecated but still honoured.
          example: CRM-Q-BILLING
        name:
          type: string
        channel_types:
          type: array
          items:
            $ref: "#/components/schemas/ChannelType"
          minItems: 1
        priority:
          type: integer
        acw_sec:
          type: integer
        enabled:
          type: boolean
        version:
          type: integer
          description: Optimistic-lock version. Mismatch → HTTP 409.
          example: 1

    # Channel (CAT-05)
    ChannelType:
      type: string
      description: Supported channel types in v0.1.
      enum:
        - voice
        - chat
        - email

    Channel:
      type: object
      description: >
        A channel in the catalog. Channels represent a logical communication
        medium (voice, chat, email). They link to a default queue for
        unrouted interactions.
      required:
        - id
        - org_id
        - code
        - name
        - channel_type
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier (D04_1-01). Required, immutable
            after create. Composite UNIQUE (org_id, code). Used as the upsert
            key for bulk import (Phase 5) and cross-reference target for
            nested relationships and future DSL references.
          example: channel_voice_primary
        external_id:
          type: string
          nullable: true
          description: |
            Optional caller-assigned identifier from an external system
            (HR, CRM, etc.). Used for sync mapping only — NOT the upsert
            key for bulk import (use `code` for that). Partial unique
            within an org when present. v0.1 supports at most one
            external source per entity per org; multi-source
            disambiguation deferred to v0.2 via `external_source TEXT`.
          example: CRM-CH-VOICE
        name:
          type: string
          example: "Main Voice Channel"
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        default_queue_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
          description: >
            Default queue for interactions arriving on this channel when no
            flow route is configured. Null means no default queue.
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          minimum: 1
          description: >
            Monotonically increasing optimistic-lock version counter (CAT-08,
            OQ-1/A4). Server-owned. Mismatch on update returns HTTP 409.
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateChannelRequest:
      type: object
      required:
        - code
        - name
        - channel_type
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier. Required on create, immutable
