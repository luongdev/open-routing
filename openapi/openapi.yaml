openapi: 3.0.0

info:
  title: Open Routing API
  version: 0.1.0
  description: |
    REST management API for Open Routing — an embeddable, multi-channel routing
    platform. All catalog CRUD, agent state transitions, bulk import, and
    infrastructure endpoints are defined here.

    ## Multi-Org Isolation

    Every endpoint under `/v1/orgs/{org_id}/` is gated by the `OrgContext`
    middleware. Pass the organization's UUIDv7 in the `X-Org-Id` request header.
    The path parameter `{org_id}` is present for REST semantics but the
    authoritative value is always taken from the header (FOUND-03, FOUND-05).

    ## Error Envelope (D-35, D-36)

    All error responses use a canonical JSON shape:

    ```json
    { "error": "<ErrorCode>", "reason": "<detail>", "request_id": "<uuidv7>" }
    ```

    The `error` field is a closed enum (see `ErrorCode` schema). The
    `request_id` field is the per-request UUIDv7 minted by the `RequestID`
    middleware; it is omitted on bypass routes that run before the middleware.

    ## UUID Convention (D-19, D-20)

    All IDs (primary keys, `org_id`, foreign keys) are UUIDv7 or higher.
    UUIDv4 and lower are rejected with `HTTP 400 / invalid_id`.

    ## Pagination (CAT-10)

    List endpoints use cursor-based pagination. The cursor is an opaque
    base64-encoded composite of `{created_at, id}`. Pass `next_cursor` from
    the previous response as `?cursor=<token>` to fetch the next page.

    ## Spec version

    This spec describes the v0.1 Catalog Foundation milestone. Catalog
    CRUD endpoints live under the `/v1/orgs/{org_id}/` prefix.

  contact:
    name: Open Routing
    url: https://github.com/luongdev/open-routing
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /
    description: Same-origin (relative base)
  - url: http://localhost:8080
    description: Local development

# ─── Security Schemes ─────────────────────────────────────────────────────────
# D-21: stub auth in v0.1. X-Org-Id acts as the org bearer token.
# Real JWT auth arrives in v1 AUTH-01. The scheme name "OrgHeader" is used
# on every path under /v1/ (applied via the global security block below each
# path group).

components:
  securitySchemes:
    OrgHeader:
      type: apiKey
      in: header
      name: X-Org-Id
      description: |
        UUIDv7 identifying the organization. Required on all `/v1/` endpoints.
        (FOUND-08) The `{org_id}` path segment is decorative — the middleware
        reads the header exclusively; mismatches between path and header values
        always use the header value. Description: The `{org_id}` path parameter
        mirrors the header for REST semantics but the authoritative `org_id` for
        database scoping is always read from `X-Org-Id`. This prevents
        cross-org data leakage when a hostile client edits the URL (FOUND-08
        OrgIdPath leakage guard).

# ─── Reusable Schemas ─────────────────────────────────────────────────────────

  schemas:

    # ── Identifiers ────────────────────────────────────────────────────────────

    UUIDv7:
      type: string
      format: uuid
      description: |
        A UUIDv7 (RFC 9562 §5.7) time-ordered unique identifier.
        Version must be 7 or higher; UUIDv4 and lower are rejected.
        Example: `01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e`
      example: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    # ── Error Envelope ─────────────────────────────────────────────────────────

    ErrorCode:
      type: string
      description: |
        Closed enum of machine-readable error codes (D-36, D-75, ROADMAP Phase 3
        criterion 4). Clients branch on this value — never on `reason` or HTTP
        status alone.
      enum:
        - invalid_body
        - invalid_id
        - not_found
        - internal
        - version_conflict
        - cross_org
        - invalid_org_id
        - invalid_transition
        - import_failed
        - rate_limited
        - invalid_reference
        - invalid_value

    ErrorResponse:
      type: object
      description: |
        Canonical error envelope (D-35). Present on every 4xx/5xx response.
        `request_id` is omitted on bypass routes that run before the RequestID
        middleware (e.g. responses from the OrgContext middleware itself for
        missing/malformed X-Org-Id).
      required:
        - error
        - reason
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        reason:
          type: string
          description: >
            Human-readable contextual detail for debugging. Clients MUST NOT
            branch on this value — it is subject to change across minor versions.
          example: "missing_header"
        request_id:
          $ref: "#/components/schemas/UUIDv7"
          description: >
            Per-request UUIDv7 minted by the RequestID middleware. Embedded in
            error bodies for support DX — users include this in bug reports.
            Absent when the response is emitted before the RequestID middleware
            runs (bypass routes, middleware-reject paths).

    # ── D-37 Special-Case Error Extensions ─────────────────────────────────────

    VersionConflictErrorResponse:
      type: object
      description: |
        HTTP 409 response for optimistic concurrency mismatches (CAT-08, D-37).
        Extends the canonical error envelope with `current` — the server-side
        record as of the moment of the conflict. The UI uses `current` to show
        a diff/merge affordance so the user can see what changed.
      required:
        - error
        - reason
        - current
      properties:
        error:
          type: string
          enum:
            - version_conflict
        reason:
          type: string
          example: "version_mismatch"
        request_id:
          $ref: "#/components/schemas/UUIDv7"
        current:
          description: >
            The complete server-side entity record at the time of the conflict.
            Schema depends on which entity was being updated — see per-entity
            response schemas.

    InvalidTransitionErrorResponse:
      type: object
      description: |
        HTTP 409 response for invalid agent-state transitions (STATE-03, D-37).
        Extends the canonical error envelope with `from` and `to` — the
        requested state pair that is not in the allowed transition matrix.
      required:
        - error
        - reason
        - from
        - to
      properties:
        error:
          type: string
          enum:
            - invalid_transition
        reason:
          type: string
          example: "not_in_allowed_matrix"
        request_id:
          $ref: "#/components/schemas/UUIDv7"
        from:
          $ref: "#/components/schemas/AgentStatus"
        to:
          $ref: "#/components/schemas/AgentStatus"

    # ── Pagination ─────────────────────────────────────────────────────────────

    PaginatedList:
      type: object
      description: |
        Common cursor-based pagination envelope (CAT-10). Reused across all
        six catalog entity list endpoints via `allOf` with an entity-specific
        `items` property override.

        The cursor is an opaque base64-encoded composite of `{created_at, id}`.
        Cursor internals are not part of the public contract — clients MUST
        treat it as an opaque string. Do not parse or construct cursor values.
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          description: The current page of results.
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque base64 cursor for the next page. `null` when this is the
            last page. Pass as `?cursor=<value>` on the next request.
          example: "eyJjcmVhdGVkX2F0IjoiMjAyNi0wNS0xNVQwMDowMDowMFoiLCJpZCI6IjAxOTAxYjJjLTdmM2EtN2FiYy04ZDRlLTVmNmE3YjhjOWQwZSJ9"
        has_more:
          type: boolean
          description: >
            `true` when there are more results beyond this page.
            Prefer `has_more` over checking `next_cursor != null` for clarity.

    # ── Catalog Entity Schemas ─────────────────────────────────────────────────

    # Agent (CAT-01, CAT-03)
    AgentSkillAssignment:
      type: object
      description: A skill assigned to an agent with a proficiency rating.
      required:
        - skill_id
        - proficiency
      properties:
        skill_id:
          $ref: "#/components/schemas/UUIDv7"
          description: The skill being assigned.
        name:
          type: string
          description: Skill name — included on GET detail responses, omitted on write bodies.
          readOnly: true
          example: "Billing Support"
        proficiency:
          type: integer
          description: >
            Agent proficiency rating on this skill. Inclusive range 1
            (beginner) to 10 (expert). The OpenAPI schema intentionally
            omits `minimum`/`maximum` so the oapi-codegen Layer 1 validator
            does NOT short-circuit out-of-range values with HTTP 400. The
            handler (catalog package, Plan 03-09) enforces the 1-10 range
            and returns HTTP 422 with `ErrorCode=invalid_value` when the
            value is out of range — see ROADMAP Phase 3 success criterion 4.
            Clients should still display min=1/max=10 in UI to prevent
            obvious mistakes; the wire shape distinguishes "wrong value"
            (422 invalid_value) from "wrong type" (400 invalid_body).
          example: 8

    Agent:
      type: object
      description: >
        An agent in the catalog. Agents are the humans (or bots) who handle
        routed interactions. Each agent belongs to exactly one org.
      required:
        - id
        - org_id
        - external_id
        - name
        - email
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
          description: Server-minted UUIDv7 primary key.
        org_id:
          $ref: "#/components/schemas/UUIDv7"
          description: The org this agent belongs to.
        external_id:
          type: string
          description: >
            Caller-assigned stable identifier for sync/import (e.g. HR system
            employee ID). Unique within the org. `UNIQUE (org_id, external_id)`.
          example: "EMP-0042"
        name:
          type: string
          description: Display name of the agent.
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          description: Agent email address.
          example: "alice@example.com"
        enabled:
          type: boolean
          description: >
            Soft-delete flag. `false` means the agent is disabled and will not
            appear in default list responses (CAT-09). Use `?include_disabled=true`
            to surface disabled agents.
          example: true
        version:
          type: integer
          description: >
            Monotonically increasing optimistic-lock version counter (CAT-08).
            Must be included in `PATCH` requests; mismatch returns HTTP 409.
          example: 1
        skills:
          type: array
          description: >
            Skills assigned to this agent with proficiency ratings. Embedded
            on detail GET responses only; omitted from list responses (CAT-10
            list items are flat, OQ-1A). Not present on create/list responses.
          items:
            $ref: "#/components/schemas/AgentSkillAssignment"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    AgentListItem:
      type: object
      description: >
        Flat agent record returned in list responses. Skills are intentionally
        omitted (OQ-1A resolution — embed skills only on detail responses).
      required:
        - id
        - org_id
        - external_id
        - name
        - email
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        external_id:
          type: string
          example: "EMP-0042"
        name:
          type: string
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          example: "alice@example.com"
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateAgentRequest:
      type: object
      description: Request body for creating an agent.
      required:
        - external_id
        - name
        - email
      properties:
        external_id:
          type: string
          description: Caller-assigned stable identifier. Must be unique within the org.
          example: "EMP-0042"
        name:
          type: string
          description: Display name.
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          description: Agent email address.
          example: "alice@example.com"
        enabled:
          type: boolean
          description: Initial enabled state. Defaults to `true`.
          default: true
        skills:
          type: array
          description: Initial skill assignments. Omit to create with no skills.
          items:
            $ref: "#/components/schemas/AgentSkillAssignment"

    UpdateAgentRequest:
      type: object
      description: >
        Request body for updating an agent. Include `version` from the last
        GET response for optimistic concurrency (CAT-08).
      required:
        - version
      properties:
        name:
          type: string
          example: "Alice Nguyen"
        email:
          type: string
          format: email
          example: "alice@example.com"
        enabled:
          type: boolean
        version:
          type: integer
          description: Current optimistic-lock version. Mismatch → HTTP 409.
          example: 1
        skills:
          type: array
          description: >
            Full-replacement skill assignment array (PUT semantics on the join
            table — OQ-1A resolution). Replaces the entire set atomically. Omit
            to leave skills unchanged.
          items:
            $ref: "#/components/schemas/AgentSkillAssignment"

    # Skill (CAT-02)
    Skill:
      type: object
      description: A skill in the catalog. Skills are assigned to agents with a proficiency rating.
      required:
        - id
        - org_id
        - external_id
        - name
        - skill_type
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        external_id:
          type: string
          example: "SKILL-BILLING"
        name:
          type: string
          example: "Billing Support"
        description:
          type: string
          nullable: true
          description: Optional long-form description.
          example: "Handle billing inquiries, refunds, and payment disputes."
        skill_type:
          type: string
          description: >
            Category or domain of the skill (e.g. "technical", "language",
            "product"). Free text — the platform does not restrict values.
          example: "support"
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateSkillRequest:
      type: object
      required:
        - external_id
        - name
        - skill_type
      properties:
        external_id:
          type: string
          example: "SKILL-BILLING"
        name:
          type: string
          example: "Billing Support"
        description:
          type: string
          nullable: true
          example: "Handle billing inquiries and payment disputes."
        skill_type:
          type: string
          example: "support"
        enabled:
          type: boolean
          default: true

    UpdateSkillRequest:
      type: object
      required:
        - version
      properties:
        name:
          type: string
          example: "Billing Support"
        description:
          type: string
          nullable: true
        skill_type:
          type: string
          example: "support"
        enabled:
          type: boolean
        version:
          type: integer
          description: Optimistic-lock version. Mismatch → HTTP 409.
          example: 1

    # Queue (CAT-04)
    Queue:
      type: object
      description: >
        A queue in the catalog. Queues hold interactions waiting to be assigned
        to an agent. Queues have a channel type, priority, and an after-contact
        work (ACW) timer.
      required:
        - id
        - org_id
        - external_id
        - name
        - channel_types
        - priority
        - acw_sec
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        external_id:
          type: string
          example: "QUEUE-BILLING"
        name:
          type: string
          example: "Billing Queue"
        channel_types:
          type: array
          description: Channel types this queue accepts (e.g. ["voice", "chat"]).
          items:
            $ref: "#/components/schemas/ChannelType"
          minItems: 1
        priority:
          type: integer
          description: >
            Queue priority. Higher values indicate higher priority. Used by the
            routing engine to break ties among equally-skilled agents.
          example: 5
        acw_sec:
          type: integer
          description: >
            After-contact work (ACW / WrapUp) timer in seconds. When an
            interaction ends, the agent enters WrapUp for this many seconds.
          example: 60
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateQueueRequest:
      type: object
      required:
        - external_id
        - name
        - channel_types
        - priority
        - acw_sec
      properties:
        external_id:
          type: string
          example: "QUEUE-BILLING"
        name:
          type: string
          example: "Billing Queue"
        channel_types:
          type: array
          items:
            $ref: "#/components/schemas/ChannelType"
          minItems: 1
        priority:
          type: integer
          example: 5
        acw_sec:
          type: integer
          example: 60
        enabled:
          type: boolean
          default: true

    UpdateQueueRequest:
      type: object
      required:
        - version
      properties:
        name:
          type: string
        channel_types:
          type: array
          items:
            $ref: "#/components/schemas/ChannelType"
          minItems: 1
        priority:
          type: integer
        acw_sec:
          type: integer
        enabled:
          type: boolean
        version:
          type: integer
          description: Optimistic-lock version. Mismatch → HTTP 409.
          example: 1

    # Channel (CAT-05)
    ChannelType:
      type: string
      description: Supported channel types in v0.1.
      enum:
        - voice
        - chat
        - email

    Channel:
      type: object
      description: >
        A channel in the catalog. Channels represent a logical communication
        medium (voice, chat, email). They link to a default queue for
        unrouted interactions.
      required:
        - id
        - org_id
        - external_id
        - name
        - channel_type
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        external_id:
          type: string
          example: "CHAN-VOICE-MAIN"
        name:
          type: string
          example: "Main Voice Channel"
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        default_queue_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
          description: >
            Default queue for interactions arriving on this channel when no
            flow route is configured. Null means no default queue.
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          minimum: 1
          description: >
            Monotonically increasing optimistic-lock version counter (CAT-08,
            OQ-1/A4). Server-owned. Mismatch on update returns HTTP 409.
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateChannelRequest:
      type: object
      required:
        - external_id
        - name
        - channel_type
      properties:
        external_id:
          type: string
          example: "CHAN-VOICE-MAIN"
        name:
          type: string
          example: "Main Voice Channel"
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        default_queue_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true

    UpdateChannelRequest:
      type: object
      description: >
        Request body for updating a channel. Include `version` from the last
        GET response for optimistic concurrency (CAT-08).
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: Current optimistic-lock version. Mismatch → HTTP 409.
          example: 1
        name:
          type: string
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        default_queue_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
        enabled:
          type: boolean

    # Adapter (CAT-06)
    Adapter:
      type: object
      description: >
        An adapter registry row. Adapters represent integration points (e.g.
        a FreeSWITCH bridge, a LiveKit gateway). In v0.1 this is a catalog
        row only — no SDK contract, no execution. Real adapter execution lands
        in a later milestone.
      required:
        - id
        - org_id
        - name
        - adapter_type
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        name:
          type: string
          description: Display name for this adapter configuration.
          example: "FreeSWITCH Bridge - DC1"
        adapter_type:
          type: string
          description: >
            Identifier for the adapter kind (e.g. "freeswitch", "livekit",
            "twilio"). Free text — the platform does not restrict values in v0.1.
          example: "freeswitch"
        config:
          type: object
          description: >
            Free-form JSONB configuration blob. Shape is adapter-type-specific.
            No vendor-specific fixed columns — everything goes in this field.
          additionalProperties: true
          example:
            host: "sip.example.com"
            port: 5060
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          minimum: 1
          description: >
            Monotonically increasing optimistic-lock version counter (CAT-08,
            OQ-1/A4). Server-owned. Mismatch on update returns HTTP 409.
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateAdapterRequest:
      type: object
      required:
        - name
        - adapter_type
      properties:
        name:
          type: string
          example: "FreeSWITCH Bridge - DC1"
        adapter_type:
          type: string
          example: "freeswitch"
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Free-form JSONB configuration blob. Null to leave empty.
        enabled:
          type: boolean
          default: true

    UpdateAdapterRequest:
      type: object
      description: >
        Request body for updating an adapter. Include `version` from the last
        GET response for optimistic concurrency (CAT-08).
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: Current optimistic-lock version. Mismatch → HTTP 409.
          example: 1
        name:
          type: string
        adapter_type:
          type: string
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Free-form JSONB configuration blob. Null to clear.
        enabled:
          type: boolean

    # Break Reason (CAT-07)
    BreakReason:
      type: object
      description: >
        A configurable reason an agent can enter the Break state. Each reason
        has a `routable` flag that determines whether the agent is eligible for
        routing while on break. The `IsRoutable` domain helper checks this
        (STATE-10).
      required:
        - id
        - org_id
        - name
        - routable
        - display_order
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        name:
          type: string
          description: Display label shown on the agent desktop.
          example: "Lunch"
        routable:
          type: boolean
          description: >
            Whether an agent on this break reason is eligible for routing.
            `true` → agent can still receive interactions (e.g. "Short break").
            `false` → agent is unavailable (e.g. "Lunch", "Training").
          example: false
        display_order:
          type: integer
          description: >
            Sort position in the break reason picker. Lower values appear first.
          example: 1
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateBreakReasonRequest:
      type: object
      required:
        - name
        - routable
        - display_order
      properties:
        name:
          type: string
          example: "Lunch"
        routable:
          type: boolean
          example: false
        display_order:
          type: integer
          example: 1
        enabled:
          type: boolean
          default: true

    UpdateBreakReasonRequest:
      type: object
      required:
        - version
      properties:
        name:
          type: string
        routable:
          type: boolean
        display_order:
          type: integer
        enabled:
          type: boolean
        version:
          type: integer
          description: Optimistic-lock version. Mismatch → HTTP 409.
          example: 1

    # ── Agent State Schemas ────────────────────────────────────────────────────

    AgentStatus:
      type: string
      description: |
        Agent availability status values (STATE-01).

        **Agent-toggleable:**
        - `Ready` — available to receive interactions
        - `NotReady` — unavailable (no sub-reasons; contrast with Break)
        - `Break` — temporary unavailability with a configurable reason

        **System-set:**
        - `Engaged` — currently handling an interaction (system-initiated only)
        - `WrapUp` — post-interaction after-contact work period (system-initiated)
        - `Offline` — agent is logged out or timed out (system-initiated)
      enum:
        - Ready
        - NotReady
        - Break
        - Engaged
        - WrapUp
        - Offline

    PostInteractionState:
      type: string
      description: >
        The state the agent transitions to after the WrapUp period ends (STATE-06).
        Set by the agent while Engaged. Applied by the system when WrapUp expires.
      enum:
        - ready
        - not_ready

    AgentState:
      type: object
      description: >
        The full agent state record (STATE-01). Returned by the status PATCH
        on success to avoid a follow-up GET (OQ-3C resolution).
      required:
        - agent_id
        - org_id
        - status
        - state_version
        - updated_at
      properties:
        agent_id:
          $ref: "#/components/schemas/UUIDv7"
          description: The agent this state row belongs to.
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        status:
          $ref: "#/components/schemas/AgentStatus"
        engaged_channel:
          allOf:
            - $ref: "#/components/schemas/ChannelType"
          type: string
          nullable: true
          description: >
            The channel type the agent is currently engaged on (STATE-05).
            Non-null only when `status == Engaged`. Null in all other states.
        break_reason_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
          description: >
            The break reason for the current Break state (STATE-04).
            Non-null only when `status == Break`. Null in all other states.
        post_interaction_state:
          allOf:
            - $ref: "#/components/schemas/PostInteractionState"
          type: string
          nullable: true
          description: >
            The target state after WrapUp expires (STATE-06). Set while Engaged.
            Null when not in Engaged or WrapUp state.
        wrapup_until:
          type: string
          format: date-time
          nullable: true
          description: >
            Server-owned TTL for the WrapUp state (STATE-07). When now() passes
            this timestamp, the background goroutine fires the WrapUp →
            `post_interaction_state` transition. Null in all other states.
          example: "2026-05-15T00:05:00Z"
        state_version:
          type: integer
          description: >
            Monotonically increasing version counter (STATE-08). Incremented on
            every state mutation. UI uses this to detect stale polling responses.
          example: 3
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    PatchAgentStatusRequest:
      type: object
      description: |
        Request body for agent-state transitions (STATE-02, STATE-03, STATE-04,
        STATE-05). Single transition per call (OQ-3A resolution).

        **Allowed agent-initiated transitions** (STATE-02):
        - `NotReady` → `Ready`
        - `Ready` → `NotReady`
        - `Ready` → `Break` (requires `break_reason_id`)
        - `Break` → `Ready`
        - `Break` → `NotReady`
        - `WrapUp` → `Ready`
        - `WrapUp` → `NotReady`

        **System-only transitions** (cannot be triggered via this endpoint):
        - `Ready` → `Engaged` (requires `engaged_channel`)
        - `Engaged` → `WrapUp`
        - `WrapUp` → `Ready` / `WrapUp` → `NotReady` (via TTL goroutine)
        - `* → Offline`, `Offline → NotReady` (login/logout events)

        A transition not in the allowed matrix returns HTTP 409 with
        `InvalidTransitionErrorResponse` (STATE-03, D-37).
      required:
        - to
      properties:
        to:
          $ref: "#/components/schemas/AgentStatus"
          description: The target state for this transition.
        break_reason_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
          description: >
            Required when `to == Break` (STATE-04). Must reference a
            `break_reason` belonging to the same org. Cross-org break reason IDs
            return HTTP 422 (not a not_found — the entity may exist, it's just
            unauthorized for this org).
        post_interaction_state:
          allOf:
            - $ref: "#/components/schemas/PostInteractionState"
          type: string
          nullable: true
          description: >
            May be set while `status == Engaged` (STATE-06). Specifies the
            target state when WrapUp expires. Ignored on other transitions.

    # ── Bulk Import Schemas ────────────────────────────────────────────────────

    ImportEntityType:
      type: string
      description: The catalog entity type being imported.
      enum:
        - agents
        - skills
        - queues
        - channels
        - adapters
        - break_reasons

    BulkImportFailedRow:
      type: object
      description: >
        A failed row in a bulk import batch (IMP-04). The original row content
        is NOT echoed (deferred to v0.2 IMP-11 error CSV download — OQ-2A
        resolution). Row numbers are 1-based; row 1 is the first data row after
        the header in CSV, or the first array item for JSON.
      required:
        - row
        - error
        - reason
      properties:
        row:
          type: integer
          description: 1-based row number of the failed record.
          example: 3
        field:
          type: string
          nullable: true
          description: The field name that caused the failure, if field-level.
          example: "email"
        error:
          type: string
          enum:
            - import_failed
          description: Always `import_failed` for row-level errors (D-36).
        reason:
          type: string
          description: Human-readable explanation of the failure.
          example: "invalid email format"

    BulkImportResult:
      type: object
      description: |
        HTTP 207 multi-status body for bulk import (IMP-05, D-37).

        NOT an error envelope — separate top-level schema. The `failed[]` items
        use the error envelope shape internally for consistency, but the
        top-level response is its own schema.

        HTTP 200 when all rows succeed (no `failed` entries). HTTP 207 when any
        rows fail AND at least one row succeeds. HTTP 422 when ALL rows fail
        (no rows succeeded).
      required:
        - succeeded
        - failed
      properties:
        succeeded:
          type: array
          description: UUIDv7 IDs of successfully created/updated records.
          items:
            $ref: "#/components/schemas/UUIDv7"
        failed:
          type: array
          description: Structured errors for each failed row. Empty when all rows succeed.
          items:
            $ref: "#/components/schemas/BulkImportFailedRow"

    ImportJob:
      type: object
      description: >
        A persisted import job record (IMP-06). Created by the import endpoint;
        queryable via `GET /v1/orgs/{org_id}/imports/{id}`.
      required:
        - id
        - org_id
        - entity_type
        - total_rows
        - succeeded_rows
        - failed_rows
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        entity_type:
          $ref: "#/components/schemas/ImportEntityType"
        total_rows:
          type: integer
          example: 100
        succeeded_rows:
          type: integer
          example: 97
        failed_rows:
          type: integer
          example: 3
        errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BulkImportFailedRow"
          description: Structured errors for failed rows; same shape as BulkImportResult.failed.
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    # ── Infrastructure Schemas ─────────────────────────────────────────────────

    HealthResponse:
      type: object
      description: Liveness check response (D-17).
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - alive
          example: "alive"

    ReadinessCheck:
      type: string
      description: Status of an individual readiness check.
      enum:
        - ok
        - degraded

    ReadinessResponse:
      type: object
      description: Deep readiness check response (D-17).
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: "ok"
        checks:
          type: object
          required:
            - db
            - redis
            - migrations
          properties:
            db:
              $ref: "#/components/schemas/ReadinessCheck"
            redis:
              $ref: "#/components/schemas/ReadinessCheck"
            migrations:
              type: object
              required:
                - version
              properties:
                version:
                  type: integer
                  description: Current applied migration version from the schema_migrations table.
                  example: 1

  # ── Reusable Parameters ───────────────────────────────────────────────────────

  parameters:

    OrgIdPath:
      name: org_id
      in: path
      required: true
      description: |
        Organization UUIDv7. Present in the path for REST semantics. The
        authoritative `org_id` used for DB scoping is always read from the
        `X-Org-Id` header by the `OrgContext` middleware — this path parameter
        is not used for data access (FOUND-08 leakage guard: a hostile client
        cannot drive cross-org behavior by editing the URL because the code
        never reads `{org_id}` from the path).
      schema:
        $ref: "#/components/schemas/UUIDv7"

    EntityIdPath:
      name: id
      in: path
      required: true
      description: >
        Entity UUIDv7 primary key. Must be a valid UUIDv7; UUIDv4 or lower
        returns HTTP 400 `invalid_id`.
      schema:
        $ref: "#/components/schemas/UUIDv7"

    ImportJobIdPath:
      name: import_id
      in: path
      required: true
      description: Import job UUIDv7 returned by the POST /catalog/import endpoint.
      schema:
        $ref: "#/components/schemas/UUIDv7"

    CursorQuery:
      name: cursor
      in: query
      required: false
      description: >
        Opaque pagination cursor returned as `next_cursor` from the previous
        list response. Omit to fetch the first page.
      schema:
        type: string

    LimitQuery:
      name: limit
      in: query
      required: false
      description: >
        Maximum number of items to return per page. Defaults to 25. Maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    IncludeDisabledQuery:
      name: include_disabled
      in: query
      required: false
      description: >
        When `true`, include disabled entities (`enabled=false`) in list
        responses. Default `false` (CAT-09).
      schema:
        type: boolean
        default: false

    NameSearchQuery:
      name: name
      in: query
      required: false
      description: >
        Case-insensitive substring search on the `name` field (ILIKE `%?%`).
        Returns entities whose name contains the value anywhere (not
        prefix-only — OQ-4B resolution). Add `pg_trgm` index for performance
        at larger catalog sizes.
      schema:
        type: string

    EntityTypeQuery:
      name: entity
      in: query
      required: true
      description: The catalog entity type being imported.
      schema:
        $ref: "#/components/schemas/ImportEntityType"

    SchemaVersionQuery:
      name: schema_version
      in: query
      required: false
      description: >
        CSV schema version for import validation (IMP-08). Required when
        `Content-Type: text/csv`. Mismatched version returns HTTP 400 with
        supported versions listed. Example: `v0.1`.
      schema:
        type: string

  # ── Reusable Responses ────────────────────────────────────────────────────────

  responses:

    BadRequest:
      description: Invalid request body, missing required fields, type mismatch, malformed IDs, or invalid `X-Org-Id` header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_body
            reason: malformed_json
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    InvalidOrgID:
      description: Missing, malformed, or non-UUIDv7 `X-Org-Id` header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_org_id
            reason: missing_header

    NotFound:
      description: >
        Resource not found, or cross-org probe (FOUND-08 leakage guard —
        a correct ID in a different org returns 404, not 403).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not_found
            reason: no_such_agent
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    RequestEntityTooLarge:
      description: >
        Request body exceeds the 50 MB / 500 row import limit (IMP-07).
        Use the v0.2 async pathway for larger imports.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_body
            reason: request_too_large_use_async_pathway
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal
            reason: unexpected_error
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:

  # ── Infrastructure Bypass Routes (no OrgContext middleware) ──────────────────

  /healthz:
    get:
      tags:
        - Infrastructure
      operationId: GetHealthz
      summary: Liveness probe
      description: >
        Returns HTTP 200 when the server process is alive. Does not check
        downstream dependencies. Use `/readyz` for deep health checks.
        Bypasses `OrgContext` middleware (D-17, D-21).
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags:
        - Infrastructure
      operationId: GetReadyz
      summary: Readiness probe
      description: >
        Deep readiness check. Pings the Postgres pool, pings Redis, and reads
        the current `schema_migrations` version. Returns HTTP 503 when any
        check fails. Bypasses `OrgContext` middleware (D-17, D-21).
      security: []
      responses:
        "200":
          description: All systems ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more dependency checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /openapi.yaml:
    get:
      tags:
        - Infrastructure
      operationId: GetOpenAPISpec
      summary: OpenAPI spec
      description: >
        Returns the embedded OpenAPI 3.0 spec bytes from the running binary
        (D-45). Always exactly the spec the binary was compiled against — no
        stale file risk. Bypasses `OrgContext` middleware (D-21 extended by D-45).
      security: []
      responses:
        "200":
          description: OpenAPI 3.0 YAML spec.
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      tags:
        - Infrastructure
      operationId: GetDocs
      summary: Interactive API documentation
      description: >
        Returns a static HTML page that loads the Scalar API Reference viewer
        via CDN (D-45). The viewer fetches `/openapi.yaml` from the same origin.
        Public in v0.1 (stub auth); gated behind admin role in v1.
        Bypasses `OrgContext` middleware (D-21 extended by D-45).
      security: []
      responses:
        "200":
          description: Interactive documentation HTML page.
          content:
            text/html:
              schema:
                type: string

  # ── Agents (CAT-01, CAT-03) ──────────────────────────────────────────────────

  /v1/orgs/{org_id}/agents:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"

    post:
      tags:
        - Agents
      operationId: CreateAgent
      summary: Create an agent
      description: >
        Creates a new agent in the org. The server mints a UUIDv7 `id`.
        `external_id` must be unique within the org (FOUND-06). Skills can be
        provided at creation time via the `skills` array.
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created. Returns the full agent record with embedded skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: >
            Duplicate `external_id` within the org, or optimistic concurrency
            conflict (version mismatch, CAT-08). On version mismatch the body
            includes the current server-side record.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/VersionConflictErrorResponse"
        "422":
          description: >
            Semantically invalid request — structurally valid JSON that fails
            a business-rule check (D-75, ROADMAP Phase 3 CRIT 4, Codex C2 iter
            3). Two flavors share this status:
            (a) `invalid_reference` — a `skills[].skill_id` references a skill
                that does not exist in the caller's org (CAT-03).
            (b) `invalid_value` — a `skills[].proficiency` value is outside
                the inclusive range 1-10.
            The `field` slot in ErrorResponse identifies which request body
            path failed (e.g. `skills[0].proficiency`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - Agents
      operationId: ListAgents
      summary: List agents
      description: >
        Returns a paginated list of agents. Skills are NOT embedded on list
        items — use `GET /agents/{id}` for the detail with skills (OQ-1A).
        Disabled agents (`enabled=false`) are excluded unless
        `?include_disabled=true` (CAT-09).
      security:
        - OrgHeader: []
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/IncludeDisabledQuery"
        - $ref: "#/components/parameters/NameSearchQuery"
      responses:
        "200":
          description: Paginated list of agents (flat, no skills).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AgentListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/orgs/{org_id}/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/EntityIdPath"

    get:
      tags:
        - Agents
      operationId: GetAgent
      summary: Get agent by ID
      description: >
        Returns the full agent record including the embedded `skills` array
        (CAT-03, OQ-1A). Cross-org probes return HTTP 404 — not HTTP 403
        (FOUND-08 leakage guard).
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Agent with embedded skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Agents
      operationId: UpdateAgent
      summary: Update an agent
      description: >
        Partial update of an agent. Include `version` from the last GET
        response for optimistic concurrency (CAT-08). A mismatch returns
        HTTP 409 with the current server-side record in the body.

        Providing `skills` replaces the entire join-table set atomically
        (PUT-semantics on the skills array — OQ-1A resolution). Omit `skills`
        to leave the existing assignments unchanged.
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Agent updated. Returns the full updated agent with skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version mismatch. Body contains the current server-side agent record (D-37).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VersionConflictErrorResponse"
                  - type: object
                    properties:
                      current:
                        $ref: "#/components/schemas/Agent"
        "422":
          description: >
            Semantically invalid request — structurally valid JSON that fails
            a business-rule check (D-75, ROADMAP Phase 3 CRIT 4). Two flavors
            share this status:
            (a) `invalid_reference` — a `skills[].skill_id` references a skill
                that does not exist in the caller's org (CAT-03, PUT-semantics
                replacement).
            (b) `invalid_value` — a `skills[].proficiency` value is outside
                the inclusive range 1-10.
            The `field` slot in ErrorResponse identifies which request body
            path failed (e.g. `skills[0].proficiency`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Agents
      operationId: DeleteAgent
      summary: Soft-delete an agent
      description: >
        Soft-deletes the agent by setting `enabled=false`. The record persists
        in the database. Use `?include_disabled=true` on list endpoints to
        surface soft-deleted agents (CAT-09).
      security:
        - OrgHeader: []
      responses:
        "204":
          description: Agent disabled.
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Agent State (STATE-01 through STATE-09) ──────────────────────────────────

  /v1/orgs/{org_id}/agents/{id}/status:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/EntityIdPath"

    get:
      tags:
        - AgentState
      operationId: GetAgentStatus
      summary: Get agent state
      description: >
        Returns the current agent state record (STATE-01). The UI polls this
        endpoint every ~5 seconds (REST polling only in v0.1 — no SSE, OQ-3D).
        Use `state_version` to detect stale polling responses (STATE-08).
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Current agent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentState"
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - AgentState
      operationId: PatchAgentStatus
      summary: Transition agent state
      description: |
        Initiates an agent-state transition (STATE-02). Returns the full
        updated `AgentState` on success to avoid a follow-up GET (OQ-3C).

        **Allowed agent-initiated transitions** (STATE-02):
        - `NotReady → Ready`
        - `Ready → NotReady`
        - `Ready → Break` (requires `break_reason_id` — STATE-04)
        - `Break → Ready`
        - `Break → NotReady`
        - `WrapUp → Ready`
        - `WrapUp → NotReady`

        A transition not in the matrix returns HTTP 409 with the requested
        `from`/`to` pair in the body (STATE-03, D-37).

        `engaged_channel` is required when `to == Engaged`, but `Engaged` is
        system-initiated only — agents cannot self-transition to `Engaged`
        (STATE-05). Attempting it returns HTTP 409 `invalid_transition`.

        Setting `post_interaction_state` while the agent is `Engaged` stores
        the preference for the next WrapUp expiry transition (STATE-06).
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAgentStatusRequest"
      responses:
        "200":
          description: State transition succeeded. Returns the full updated agent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Invalid state transition. `from` and `to` identify the requested
            transition that is not in the allowed matrix (STATE-03, D-37).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTransitionErrorResponse"
        "422":
          description: >
            Semantically invalid request — e.g. `break_reason_id` not found
            or cross-org (STATE-04). Structurally valid JSON but business-rule
            violation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

