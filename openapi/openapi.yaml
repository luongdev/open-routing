  # ── Bulk Import (IMP-01 through IMP-08) ─────────────────────────────────────

  /v1/orgs/{org_id}/catalog/import:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/EntityTypeQuery"
      - $ref: "#/components/parameters/SchemaVersionQuery"

    post:
      tags:
        - Import
      operationId: BulkImportCatalog
      summary: Bulk import catalog entities
      description: |
        Bulk import for any of the 6 catalog entities (IMP-01). Accepts both
        JSON and CSV payloads on the same endpoint — the handler dispatches on
        `Content-Type` (OQ-2D resolution).

        **JSON format:** Array of entity objects matching the `Create*Request`
        shape for the target entity.

        **CSV format:** RFC 4180 with header row. Field names match the JSON
        field names. BOM handling: UTF-8 BOM is stripped automatically (IMP-02).
        Line endings: CRLF and LF both accepted (IMP-02).

        **Upsert semantics:** Rows are upserted keyed by `(org_id, code)` —
        the universal user-facing canonical identifier introduced by Phase 04.1
        (D04_1-01). Existing rows update fields, new rows insert. Running the
        same input twice produces no duplicates (IMP-03). `external_id` is
        supported as an optional integration-mapping field on every
        `Import*Request` (mutable per D04_1-07) but is NOT the upsert key.

        **Idempotency:** Clients MAY pass an `Idempotency-Key` UUIDv7 header to
        make a POST retry-safe. A repeated request with the same key in the
        same org returns the persisted prior result with `idempotent_replay:
        true` (D5-13 / D5-27). Note: in v0.1 the replay response carries an
        empty `succeeded` array because the server stores only counters +
        errors JSONB — original succeeded IDs are not reconstructable. Callers
        that need full replay should use the non-idempotent path or wait for
        v0.2.

        **Size limits:** Maximum 50 MB body and 10,000 rows. Oversized
        requests return HTTP 413 (request_too_large_use_async_pathway) before
        import processing begins. The v0.2 async pathway will handle larger
        imports.

        **Partial success:** Valid rows succeed; failed rows return structured
        errors (IMP-04). HTTP 207 when any rows fail, HTTP 200 when all succeed
        (IMP-05).

        **Import job:** A record is persisted in `import_jobs` for audit
        purposes (IMP-06). The job ID is returned in the response for `GET
        /imports/{id}` retrieval.

        **CSV schema_version:** Required for CSV payloads (IMP-08). Use
        `?schema_version=v0.1`. Mismatched versions return HTTP 400 with
        supported versions. JSON payloads do not require this parameter.
      security:
        - OrgHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        # Per-row shape is one of the six Import*Request schemas in
        # components.schemas, selected by the `?entity=` query parameter.
        # Polymorphic `oneOf` is NOT used on `application/json.items` because
        # oapi-codegen v2 does not emit accessor helpers for `oneOf` request
        # bodies (verified — see oapi-codegen issue #1620 / RESEARCH §F2).
        # The 6 schemas still appear in components.schemas so clients have
        # typed shapes; the server dispatches the per-row decode based on
        # `?entity=`.
        x-import-row-types:
          - ImportAgentRequest
          - ImportSkillRequest
          - ImportQueueRequest
          - ImportChannelRequest
          - ImportAdapterRequest
          - ImportBreakReasonRequest
        content:
          application/json:
            schema:
              type: array
              description: >
                Array of entity objects. Per-row shape is one of the six
                Import*Request schemas in `components.schemas`, selected by
                the `?entity=` query parameter. Polymorphic `oneOf` is NOT
                used because oapi-codegen v2 does not emit accessor helpers
                for `oneOf` request bodies (verified — issue #1620).
              items: {}
              maxItems: 10000
          text/csv:
            schema:
              type: string
              description: >
                RFC 4180 CSV with header row. Field names match JSON field
                names. UTF-8 with or without BOM. Max 10,000 rows.
      responses:
        "200":
          description: All rows imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "207":
          description: >
            Multi-status — some rows succeeded, some failed (IMP-05, D-37).
            The `succeeded` array contains IDs of created/updated records;
            `failed` contains structured errors for each failed row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "400":
          description: >
            Invalid request — malformed JSON/CSV body, missing required fields,
            unsupported `schema_version` (IMP-08), or missing `entity` query
            parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "422":
          description: All rows failed — no rows succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/orgs/{org_id}/imports/{import_id}:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/ImportJobIdPath"

    get:
      tags:
        - Import
      operationId: GetImportJob
      summary: Get import job result
      description: >
        Returns the persisted result of a past import job (IMP-06). The job ID
        is the UUIDv7 returned in the `BulkImportResult` from the original POST.
        In v0.1 this is a synchronous record — no polling needed. In v0.2 async
        imports will require polling this endpoint for completion.
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Import job record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── Tags ─────────────────────────────────────────────────────────────────────

tags:
  - name: Infrastructure
    description: >
      Health, readiness, spec, and docs endpoints. These bypass the `OrgContext`
      middleware and do not require the `X-Org-Id` header (D-17, D-21, D-45).
  - name: Agents
    description: >
      Agent catalog CRUD (CAT-01, CAT-03). Skills are embedded on detail
      responses; list responses are flat (OQ-1A). All write operations require
      the `version` field for optimistic concurrency (CAT-08).
  - name: AgentState
    description: >
      Agent state transitions (STATE-01 through STATE-09). The PATCH endpoint
      returns the full updated state on success to avoid a follow-up GET.
      v0.1 uses REST polling (~5s interval); push channels are deferred to v0.2.
  - name: Skills
    description: >
      Skill catalog CRUD (CAT-02). Used by the "Add skill" dropdown on agent
      detail and by import operations.
  - name: Queues
    description: >
      Queue catalog CRUD (CAT-04). Queues hold interactions waiting for
      an agent. Channel types, priority, and ACW timer are configurable.
  - name: Channels
    description: >
      Channel catalog CRUD (CAT-05). Channels represent logical communication
      media (voice, chat, email) linking to default queues.
  - name: Adapters
    description: >
      Adapter registry CRUD (CAT-06). In v0.1 adapter rows are catalog records
      only — no SDK contract, no execution. Real adapter execution is a later
      milestone.
  - name: BreakReasons
    description: >
      Break reason CRUD (CAT-07). Break reasons are org-configurable with a
      `routable` flag. The `IsRoutable` domain helper checks this (STATE-10).
  - name: Import
    description: >
      Bulk import for all 6 catalog entities (IMP-01 through IMP-08). Accepts
      JSON or CSV. Upserts keyed by `(org_id, code)` — the universal
      user-facing canonical identifier introduced by Phase 04.1 (D04_1-01);
      `external_id` is supported as an optional integration-mapping field on
      every `Import*Request` (D04_1-07) but is NOT the upsert key. Returns
      HTTP 207 on partial success. Capped at 50 MB / 10,000 rows in v0.1.
