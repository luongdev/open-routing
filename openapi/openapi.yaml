          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateAdapterRequest:
      type: object
      required:
        - code
        - name
        - adapter_type
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier. Required on create, immutable
            after (passing a different code in PATCH returns HTTP 422 with
            ErrorCode=immutable_field).
          example: adapter_freeswitch_dc1
        external_id:
          type: string
          nullable: true
          description: Optional caller-assigned identifier from an external system. See entity schema.
          example: MDM-ADAPTER-FS-DC1
        name:
          type: string
          example: "FreeSWITCH Bridge - DC1"
        adapter_type:
          type: string
          example: "freeswitch"
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Free-form JSONB configuration blob. Null to leave empty.
        enabled:
          type: boolean
          default: true

    UpdateAdapterRequest:
      type: object
      description: >
        Request body for updating an adapter. Include `version` from the last
        GET response for optimistic concurrency (CAT-08).
      required:
        - version
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            Must equal the stored value (immutable post-create in v0.1, D04_1-02).
            Passing a different value returns HTTP 422 with
            ErrorCode=immutable_field. The field is accepted in the PATCH
            body to preserve symmetry with the Create*Request shape; absent
            or matching values are no-ops. Rename support deferred to v0.2.
          example: adapter_freeswitch_dc1
        external_id:
          type: string
          nullable: true
          description: |
            Mutable external-system mapping (D04_1-07). Pass a non-empty
            string to (re)bind to an external row; pass an empty string
            `""` to CLEAR the binding (server sets external_id to SQL NULL);
            omit the field to leave the existing binding unchanged. Phase 5
            fix H2 — `null` JSON values are indistinguishable from omission
            in the current oapi-codegen pointer encoding (both decode to a
            nil `*string`), so the empty-string sentinel is the documented
            v0.1 way to clear. A future v0.2 release may add a tri-state
            wrapper that allows literal `null` to clear, at which point the
            empty-string sentinel will be deprecated but still honoured.
          example: MDM-ADAPTER-FS-DC1
        version:
          type: integer
          minimum: 1
          description: Current optimistic-lock version. Mismatch → HTTP 409.
          example: 1
        name:
          type: string
        adapter_type:
          type: string
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Free-form JSONB configuration blob. Null to clear.
        enabled:
          type: boolean

    # Break Reason (CAT-07)
    BreakReason:
      type: object
      description: >
        A configurable reason an agent can enter the Break state. Each reason
        has a `routable` flag that determines whether the agent is eligible for
        routing while on break. The `IsRoutable` domain helper checks this
        (STATE-10).
      required:
        - id
        - org_id
        - code
        - name
        - routable
        - display_order
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier (D04_1-01). Required, immutable
            after create. Composite UNIQUE (org_id, code). Used as the upsert
            key for bulk import (Phase 5) and cross-reference target for
            nested relationships and future DSL references.
          example: break_lunch
        external_id:
          type: string
          nullable: true
          description: |
            Optional caller-assigned identifier from an external system
            (HR, CRM, etc.). Used for sync mapping only — NOT the upsert
            key for bulk import (use `code` for that). Partial unique
            within an org when present. v0.1 supports at most one
            external source per entity per org; multi-source
            disambiguation deferred to v0.2 via `external_source TEXT`.
          example: HR-BREAK-LUNCH
        name:
          type: string
          description: Display label shown on the agent desktop.
          example: "Lunch"
        routable:
          type: boolean
          description: >
            Whether an agent on this break reason is eligible for routing.
            `true` → agent can still receive interactions (e.g. "Short break").
            `false` → agent is unavailable (e.g. "Lunch", "Training").
          example: false
        display_order:
          type: integer
          description: >
            Sort position in the break reason picker. Lower values appear first.
          example: 1
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    CreateBreakReasonRequest:
      type: object
      required:
        - code
        - name
        - routable
        - display_order
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            User-facing canonical identifier. Required on create, immutable
            after (passing a different code in PATCH returns HTTP 422 with
            ErrorCode=immutable_field).
          example: break_lunch
        external_id:
          type: string
          nullable: true
          description: Optional caller-assigned identifier from an external system. See entity schema.
          example: HR-BREAK-LUNCH
        name:
          type: string
          example: "Lunch"
        routable:
          type: boolean
          example: false
        display_order:
          type: integer
          example: 1
        enabled:
          type: boolean
          default: true

    UpdateBreakReasonRequest:
      type: object
      required:
        - version
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: |
            Must equal the stored value (immutable post-create in v0.1, D04_1-02).
            Passing a different value returns HTTP 422 with
            ErrorCode=immutable_field. The field is accepted in the PATCH
            body to preserve symmetry with the Create*Request shape; absent
            or matching values are no-ops. Rename support deferred to v0.2.
          example: break_lunch
        external_id:
          type: string
          nullable: true
          description: |
            Mutable external-system mapping (D04_1-07). Pass a non-empty
            string to (re)bind to an external row; pass an empty string
            `""` to CLEAR the binding (server sets external_id to SQL NULL);
            omit the field to leave the existing binding unchanged. Phase 5
            fix H2 — `null` JSON values are indistinguishable from omission
            in the current oapi-codegen pointer encoding (both decode to a
            nil `*string`), so the empty-string sentinel is the documented
            v0.1 way to clear. A future v0.2 release may add a tri-state
            wrapper that allows literal `null` to clear, at which point the
            empty-string sentinel will be deprecated but still honoured.
          example: HR-BREAK-LUNCH
        name:
          type: string
        routable:
          type: boolean
        display_order:
          type: integer
        enabled:
          type: boolean
        version:
          type: integer
          description: Optimistic-lock version. Mismatch → HTTP 409.
          example: 1

    # ── Agent State Schemas ────────────────────────────────────────────────────

    AgentStatus:
      type: string
      description: |
        Agent availability status values (STATE-01).

        **Agent-toggleable:**
        - `Ready` — available to receive interactions
        - `NotReady` — unavailable (no sub-reasons; contrast with Break)
        - `Break` — temporary unavailability with a configurable reason

        **System-set:**
        - `Engaged` — currently handling an interaction (system-initiated only)
        - `WrapUp` — post-interaction after-contact work period (system-initiated)
        - `Offline` — agent is logged out or timed out (system-initiated)
      enum:
        - Ready
        - NotReady
        - Break
        - Engaged
        - WrapUp
        - Offline

    PostInteractionState:
      type: string
      description: >
        The state the agent transitions to after the WrapUp period ends (STATE-06).
        Set by the agent while Engaged. Applied by the system when WrapUp expires.
      enum:
        - ready
        - not_ready

    AgentState:
      type: object
      description: >
        The full agent state record (STATE-01). Returned by the status PATCH
        on success to avoid a follow-up GET (OQ-3C resolution).
      required:
        - agent_id
        - org_id
        - status
        - state_version
        - updated_at
      properties:
        agent_id:
          $ref: "#/components/schemas/UUIDv7"
          description: The agent this state row belongs to.
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        status:
          $ref: "#/components/schemas/AgentStatus"
        engaged_channel:
          allOf:
            - $ref: "#/components/schemas/ChannelType"
          type: string
          nullable: true
          description: >
            The channel type the agent is currently engaged on (STATE-05).
            Non-null only when `status == Engaged`. Null in all other states.
        break_reason_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
          description: >
            The break reason for the current Break state (STATE-04).
            Non-null only when `status == Break`. Null in all other states.
        post_interaction_state:
          allOf:
            - $ref: "#/components/schemas/PostInteractionState"
          type: string
          nullable: true
          description: >
            The target state after WrapUp expires (STATE-06). Set while Engaged.
            Null when not in Engaged or WrapUp state.
        wrapup_until:
          type: string
          format: date-time
          nullable: true
          description: >
            Server-owned TTL for the WrapUp state (STATE-07). When now() passes
            this timestamp, the background goroutine fires the WrapUp →
            `post_interaction_state` transition. Null in all other states.
          example: "2026-05-15T00:05:00Z"
        state_version:
          type: integer
          description: >
            Monotonically increasing version counter (STATE-08). Incremented on
            every state mutation. UI uses this to detect stale polling responses.
          example: 3
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    PatchAgentStatusRequest:
      type: object
      description: |
        Request body for agent-state transitions (STATE-02, STATE-03, STATE-04,
        STATE-05). Single transition per call (OQ-3A resolution).

        **Allowed agent-initiated transitions** (STATE-02):
        - `NotReady` → `Ready`
        - `Ready` → `NotReady`
        - `Ready` → `Break` (requires `break_reason_id`)
        - `Break` → `Ready`
        - `Break` → `NotReady`
        - `WrapUp` → `Ready`
        - `WrapUp` → `NotReady`

        **System-only transitions** (cannot be triggered via this endpoint):
        - `Ready` → `Engaged` (requires `engaged_channel`)
        - `Engaged` → `WrapUp`
        - `WrapUp` → `Ready` / `WrapUp` → `NotReady` (via TTL goroutine)
        - `* → Offline`, `Offline → NotReady` (login/logout events)

        A transition not in the allowed matrix returns HTTP 409 with
        `InvalidTransitionErrorResponse` (STATE-03, D-37).
      required:
        - to
      properties:
        to:
          $ref: "#/components/schemas/AgentStatus"
          description: The target state for this transition.
        break_reason_id:
          allOf:
            - $ref: "#/components/schemas/UUIDv7"
          type: string
          nullable: true
          description: >
            Required when `to == Break` (STATE-04). Must reference a
            `break_reason` belonging to the same org. Cross-org break reason IDs
            return HTTP 422 (not a not_found — the entity may exist, it's just
            unauthorized for this org).
        post_interaction_state:
          allOf:
            - $ref: "#/components/schemas/PostInteractionState"
          type: string
          nullable: true
          description: >
            May be set while `status == Engaged` (STATE-06). Specifies the
            target state when WrapUp expires. Ignored on other transitions.
        force:
          type: boolean
          description: >
            Admin override (D-84). When `true`, bypasses the transition matrix
            (skips HTTP 409 `invalid_transition`). Cross-row probes still run:
            a missing or cross-org `break_reason_id` still returns HTTP 422
            (D-84 Pitfall 3). v0.1 stub auth allows any caller to pass
            `force=true`; v1 AUTH phase restricts to `org_admin` role. Use
            sparingly — every `force=true` call emits a WARN-level audit log
            entry (`state.force.applied`).

    # ── Bulk Import Schemas ────────────────────────────────────────────────────

    ImportEntityType:
      type: string
      description: The catalog entity type being imported.
      enum:
        - agents
        - skills
        - queues
        - channels
        - adapters
        - break_reasons

    BulkImportFailedRow:
      type: object
      description: >
        A failed row in a bulk import batch (IMP-04). The original row content
        is NOT echoed (deferred to v0.2 IMP-11 error CSV download — OQ-2A
        resolution). Row numbers are 1-based; row 1 is the first data row after
        the header in CSV, or the first array item for JSON.
      required:
        - row
        - error
        - reason
      properties:
        row:
          type: integer
          description: 1-based row number of the failed record.
          example: 3
        field:
          type: string
          nullable: true
          description: The field name that caused the failure, if field-level.
          example: "email"
        error:
          type: string
          enum:
            - import_failed
          description: Always `import_failed` for row-level errors (D-36).
        reason:
          type: string
          description: Human-readable explanation of the failure.
          example: "invalid email format"

    BulkImportResult:
      type: object
      description: |
        HTTP 207 multi-status body for bulk import (IMP-05, D-37).

        NOT an error envelope — separate top-level schema. The `failed[]` items
        use the error envelope shape internally for consistency, but the
        top-level response is its own schema.

        HTTP 200 when all rows succeed (no `failed` entries). HTTP 207 when any
        rows fail AND at least one row succeeds. HTTP 422 when ALL rows fail
        (no rows succeeded).
      required:
        - succeeded
        - failed
      properties:
        succeeded:
          type: array
          description: UUIDv7 IDs of successfully created/updated records.
          items:
            $ref: "#/components/schemas/UUIDv7"
        failed:
          type: array
          description: Structured errors for each failed row. Empty when all rows succeed.
          items:
            $ref: "#/components/schemas/BulkImportFailedRow"
        idempotent_replay:
          type: boolean
          default: false
          nullable: true
          readOnly: true
          description: >
            True when this response is a persisted prior result returned
            because the client repeated the Idempotency-Key (D5-13). False or
            absent on a first-time POST. v0.1 KNOWN LIMITATION: when true,
            `succeeded` is always an empty array because the server stores
            only counters; rely on `failed[]` for forensics (see operation
            description).

    ImportJob:
      type: object
      description: >
        A persisted import job record (IMP-06). Created by the import endpoint;
        queryable via `GET /v1/orgs/{org_id}/imports/{id}`.
      required:
        - id
        - org_id
        - entity_type
        - status
        - total_rows
        - succeeded_rows
        - failed_rows
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
        org_id:
          $ref: "#/components/schemas/UUIDv7"
        entity_type:
          $ref: "#/components/schemas/ImportEntityType"
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
          description: >
            Lifecycle of the import (D5-26). `pending` — the row was created
            before processing began; in v0.1 callers normally observe only
            `completed` or `failed` because the request is synchronous.
            `failed` may be set by the crash-recovery sweep (D5-11) when a
            process restart leaves a pending row stranded.
        total_rows:
          type: integer
          example: 100
        succeeded_rows:
          type: integer
          example: 97
        failed_rows:
          type: integer
          example: 3
        errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BulkImportFailedRow"
          description: Structured errors for failed rows; same shape as BulkImportResult.failed.
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T00:00:00Z"

    # ── Bulk Import Per-Entity Request Schemas (Phase 5 / IMP-01) ─────────────
    # Each schema is the per-row JSON shape selected by `?entity=` on
    # POST /v1/orgs/{org_id}/catalog/import. FK fields reference the target
    # entity by `code` (D5-15 / Phase 04.1 D04_1-01 — the universal canonical
    # user-facing identifier). `external_id` is supported as an optional
    # integration-mapping field (D04_1-07) but is NOT the upsert key.
    # Alphabetised by schema name.
    #
    # Phase 5 fix L4 — TOP-LEVEL FIELD SEMANTICS:
    #
    # The bulk-import endpoint is PUT-style for every top-level field. The
    # Upsert*ByCode SQL queries set EVERY column on the ON CONFLICT branch
    # using EXCLUDED.column, which means a column with a Go zero / SQL NULL
    # value in the import payload WILL overwrite the previously-stored
    # value. Examples:
    #   - Omitting external_id (or sending null) clears any previously-bound
    #     external_id on the existing row.
    #   - Omitting enabled (or sending null) does NOT clear it — `enabled`
    #     carries `default: true` in the OpenAPI schema, which oapi-codegen
    #     applies at decode time. Same for `routable`, `display_order`,
    #     `priority`, `acw_sec`.
    #
    # For partial updates that preserve unspecified fields, use the
    # dedicated PATCH endpoints (PATCH /v1/orgs/{org_id}/agents/{id}, etc).
    # The bulk-import endpoint is for full-row sync workflows where the
    # admin's payload IS the desired state.
    #
    # The agents.skills nested array is the documented exception — D5-18
    # mandates MERGE semantics on the join table.

    ImportAdapterRequest:
      type: object
      description: |
        Phase 5 (IMP-01) per-row JSON shape for `entity=adapters`. `config`
        is a free-form JSONB blob passed through to storage with no
        validation (D-72 Phase 3 contract).
      required: [code, name, adapter_type]
      properties:
        code:         { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        external_id:  { type: string, nullable: true }
        name:         { type: string }
        adapter_type: { type: string }
        config:
          type: object
          description: Free-form vendor configuration; no fixed schema.
          additionalProperties: true
        enabled:      { type: boolean, default: true }

    ImportAgentRequest:
      type: object
      description: |
        Phase 5 (IMP-01) per-row JSON shape for `entity=agents`. Mirror of
        CreateAgentRequest with FK references by `code` instead of UUID.
        `external_id` is optional integration-mapping (mutable per D04_1-07).
      required: [code, name, email]
      properties:
        code:        { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', example: "emp_0042" }
        external_id: { type: string, nullable: true, example: "HR-EMP-0042" }
        name:        { type: string, example: "Mai Linh" }
        email:       { type: string, format: email, example: "mai@example.com" }
        enabled:     { type: boolean, default: true }
        skills:
          type: array
          description: >
            Skill assignments referenced by `skill_code`. MERGE semantics
            (D5-18) — existing assignments not in this list are LEFT INTACT;
            proficiency for codes present in this list is set to the value
            supplied (D5-19 import wins). Skill removal via import is
            deferred to v0.2.
          items:
            type: object
            required: [skill_code, proficiency]
            properties:
              skill_code:  { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
              proficiency: { type: integer, minimum: 1, maximum: 10 }

    ImportBreakReasonRequest:
      type: object
      description: |
        Phase 5 (IMP-01) per-row JSON shape for `entity=break_reasons`.
        `name` is a mutable display label (Phase 04.1 dropped
        UNIQUE(org_id, name) — IDENT-03).
      required: [code, name]
      properties:
        code:          { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        external_id:   { type: string, nullable: true }
        name:          { type: string }
        routable:      { type: boolean, default: true }
        display_order: { type: integer, default: 0 }
        enabled:       { type: boolean, default: true }

    ImportChannelRequest:
      type: object
      description: |
        Phase 5 (IMP-01) per-row JSON shape for `entity=channels`. FK
        `default_queue_code` references an existing queue by code; cross-row
        FK probe is performed in the same chunk transaction.
      required: [code, name, channel_type]
      properties:
        code:               { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        external_id:        { type: string, nullable: true }
        name:               { type: string }
        channel_type:       { type: string }
        default_queue_code: { type: string, nullable: true, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        enabled:            { type: boolean, default: true }

    ImportQueueRequest:
      type: object
      description: Phase 5 (IMP-01) per-row JSON shape for `entity=queues`.
      required: [code, name, channel_types]
      properties:
        code:        { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        external_id: { type: string, nullable: true }
        name:        { type: string }
        channel_types:
          type: array
          items: { type: string }
          description: >
            Multi-valued — in CSV use pipe-delimited per D5-04
            (`voice|chat`); in JSON use the array form.
        priority:    { type: integer, default: 5 }
        acw_sec:     { type: integer, default: 0 }
        enabled:     { type: boolean, default: true }

    ImportSkillRequest:
      type: object
      description: Phase 5 (IMP-01) per-row JSON shape for `entity=skills`.
      required: [code, name, skill_type]
      properties:
        code:        { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        external_id: { type: string, nullable: true }
        name:        { type: string }
        description: { type: string, nullable: true }
        skill_type:  { type: string }
        enabled:     { type: boolean, default: true }

    # ── Infrastructure Schemas ─────────────────────────────────────────────────

    HealthResponse:
      type: object
      description: Liveness check response (D-17).
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - alive
          example: "alive"

    ReadinessCheck:
      type: string
      description: Status of an individual readiness check.
      enum:
        - ok
        - degraded

    ReadinessResponse:
      type: object
      description: Deep readiness check response (D-17).
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: "ok"
        checks:
          type: object
          required:
            - db
            - redis
            - migrations
          properties:
            db:
              $ref: "#/components/schemas/ReadinessCheck"
            redis:
              $ref: "#/components/schemas/ReadinessCheck"
            migrations:
              type: object
              required:
                - version
              properties:
                version:
                  type: integer
                  description: Current applied migration version from the schema_migrations table.
                  example: 1

  # ── Reusable Parameters ───────────────────────────────────────────────────────

  parameters:

    OrgIdPath:
      name: org_id
      in: path
      required: true
      description: |
        Organization UUIDv7. Present in the path for REST semantics. The
        authoritative `org_id` used for DB scoping is always read from the
        `X-Org-Id` header by the `OrgContext` middleware — this path parameter
        is not used for data access (FOUND-08 leakage guard: a hostile client
        cannot drive cross-org behavior by editing the URL because the code
        never reads `{org_id}` from the path).
      schema:
        $ref: "#/components/schemas/UUIDv7"

    EntityIdPath:
      name: id
      in: path
      required: true
      description: >
        Entity UUIDv7 primary key. Must be a valid UUIDv7; UUIDv4 or lower
        returns HTTP 400 `invalid_id`.
      schema:
        $ref: "#/components/schemas/UUIDv7"

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-generated UUIDv7 (RFC 9562 §5.7) used to make POST retry-safe
        (D5-13). A repeated request with the same key in the same org returns
        the persisted prior result with `idempotent_replay: true` (D5-27).
        Optional — absent header means a fresh job row is created each call.
      schema:
        type: string
        format: uuid
        example: "01919e1b-7c80-7c80-8000-0123456789ab"

    ImportJobIdPath:
      name: import_id
      in: path
      required: true
      description: Import job UUIDv7 returned by the POST /catalog/import endpoint.
      schema:
        $ref: "#/components/schemas/UUIDv7"

    CursorQuery:
      name: cursor
      in: query
      required: false
      description: >
        Opaque pagination cursor returned as `next_cursor` from the previous
        list response. Omit to fetch the first page.
      schema:
        type: string

    LimitQuery:
      name: limit
      in: query
      required: false
      description: >
        Maximum number of items to return per page. Defaults to 25. Maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    IncludeDisabledQuery:
      name: include_disabled
      in: query
      required: false
      description: >
        When `true`, include disabled entities (`enabled=false`) in list
        responses. Default `false` (CAT-09).
      schema:
        type: boolean
        default: false

    NameSearchQuery:
      name: name
      in: query
      required: false
      description: >
        Case-insensitive substring search on the `name` field (ILIKE `%?%`).
        Returns entities whose name contains the value anywhere (not
        prefix-only — OQ-4B resolution). Add `pg_trgm` index for performance
        at larger catalog sizes.
      schema:
        type: string

    EntityTypeQuery:
      name: entity
      in: query
      required: true
      description: The catalog entity type being imported.
      schema:
        $ref: "#/components/schemas/ImportEntityType"

    SchemaVersionQuery:
      name: schema_version
      in: query
      required: false
      description: >
        CSV schema version for import validation (IMP-08). Required when
        `Content-Type: text/csv`. Mismatched version returns HTTP 400 with
        supported versions listed. Example: `v0.1`.
      schema:
        type: string

  # ── Reusable Responses ────────────────────────────────────────────────────────

  responses:

    BadRequest:
      description: Invalid request body, missing required fields, type mismatch, malformed IDs, or invalid `X-Org-Id` header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_body
            reason: malformed_json
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    InvalidOrgID:
      description: Missing, malformed, or non-UUIDv7 `X-Org-Id` header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_org_id
            reason: missing_header

    NotFound:
      description: >
        Resource not found, or cross-org probe (FOUND-08 leakage guard —
        a correct ID in a different org returns 404, not 403).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not_found
            reason: no_such_agent
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    RequestEntityTooLarge:
      description: >
        Request body exceeds the 50 MB / 10,000 row import limit.
        Use the v0.2 async pathway for larger imports.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_body
            reason: request_too_large_use_async_pathway
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal
            reason: unexpected_error
            request_id: "01901b2c-7f3a-7abc-8d4e-5f6a7b8c9d0e"

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:

  # ── Infrastructure Bypass Routes (no OrgContext middleware) ──────────────────

  /healthz:
    get:
      tags:
        - Infrastructure
      operationId: GetHealthz
      summary: Liveness probe
      description: >
        Returns HTTP 200 when the server process is alive. Does not check
        downstream dependencies. Use `/readyz` for deep health checks.
        Bypasses `OrgContext` middleware (D-17, D-21).
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags:
        - Infrastructure
      operationId: GetReadyz
      summary: Readiness probe
      description: >
        Deep readiness check. Pings the Postgres pool, pings Redis, and reads
        the current `schema_migrations` version. Returns HTTP 503 when any
        check fails. Bypasses `OrgContext` middleware (D-17, D-21).
      security: []
      responses:
        "200":
          description: All systems ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more dependency checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /openapi.yaml:
    get:
      tags:
        - Infrastructure
      operationId: GetOpenAPISpec
      summary: OpenAPI spec
      description: >
        Returns the embedded OpenAPI 3.0 spec bytes from the running binary
        (D-45). Always exactly the spec the binary was compiled against — no
        stale file risk. Bypasses `OrgContext` middleware (D-21 extended by D-45).
      security: []
      responses:
        "200":
          description: OpenAPI 3.0 YAML spec.
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      tags:
        - Infrastructure
      operationId: GetDocs
      summary: Interactive API documentation
      description: >
        Returns a static HTML page that loads the Scalar API Reference viewer
        via CDN (D-45). The viewer fetches `/openapi.yaml` from the same origin.
        Public in v0.1 (stub auth); gated behind admin role in v1.
        Bypasses `OrgContext` middleware (D-21 extended by D-45).
      security: []
      responses:
        "200":
          description: Interactive documentation HTML page.
          content:
            text/html:
              schema:
                type: string

  /v1/meta/expr-functions:
    get:
      tags:
        - Infrastructure
      operationId: GetExprFunctions
      summary: Condition-expression function catalog
      description: >
        Static, org-independent catalog of the functions available in the flow
        condition DSL (str.*, num.*, arr.*, logic.*, date.*). The flow builder's
        Advanced editor fetches this for autocomplete. Cacheable.
      security: []
      responses:
        "200":
          description: The expression function catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExprFunctionCatalog"

  # ── Agents (CAT-01, CAT-03) ──────────────────────────────────────────────────

  /v1/orgs/{org_id}/agents:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"

    post:
      tags:
        - Agents
      operationId: CreateAgent
      summary: Create an agent
      description: >
        Creates a new agent in the org. The server mints a UUIDv7 `id`.
        `code` is required and must be unique within the org; `external_id`
        is optional and unique within the org when set. Skills can be
        provided at creation time via the `skills` array.
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created. Returns the full agent record with embedded skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            Duplicate `code` within the org (ErrorCode=duplicate_code), or
            duplicate `external_id` within the org when set
            (ErrorCode=duplicate_external_id). For agents only, an optimistic
            concurrency conflict on PATCH may also surface here (CAT-08,
            ErrorCode=version_conflict). Clients should branch on
            ErrorCode, not parse the description text.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/VersionConflictErrorResponse"
        "422":
          description: >
            Semantically invalid request — structurally valid JSON that fails
            a business-rule check (D-75, ROADMAP Phase 3 CRIT 4, Codex C2 iter
            3). Two flavors share this status:
            (a) `invalid_reference` — a `skills[].skill_id` references a skill
                that does not exist in the caller's org (CAT-03).
            (b) `invalid_value` — a `skills[].proficiency` value is outside
                the inclusive range 1-10.
            The `field` slot in ErrorResponse identifies which request body
            path failed (e.g. `skills[0].proficiency`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - Agents
      operationId: ListAgents
      summary: List agents
      description: >
        Returns a paginated list of agents. Skills are NOT embedded on list
        items — use `GET /agents/{id}` for the detail with skills (OQ-1A).
        Disabled agents (`enabled=false`) are excluded unless
        `?include_disabled=true` (CAT-09).
      security:
        - OrgHeader: []
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/IncludeDisabledQuery"
        - $ref: "#/components/parameters/NameSearchQuery"
      responses:
        "200":
          description: Paginated list of agents (flat, no skills).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AgentListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/orgs/{org_id}/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/EntityIdPath"

    get:
      tags:
        - Agents
      operationId: GetAgent
      summary: Get agent by ID
      description: >
        Returns the full agent record including the embedded `skills` array
        (CAT-03, OQ-1A). Cross-org probes return HTTP 404 — not HTTP 403
        (FOUND-08 leakage guard).
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Agent with embedded skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Agents
      operationId: UpdateAgent
      summary: Update an agent
      description: >
        Partial update of an agent. Include `version` from the last GET
        response for optimistic concurrency (CAT-08). A mismatch returns
        HTTP 409 with the current server-side record in the body.

        Providing `skills` replaces the entire join-table set atomically
        (PUT-semantics on the skills array — OQ-1A resolution). Omit `skills`
        to leave the existing assignments unchanged.
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Agent updated. Returns the full updated agent with skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Optimistic-concurrency conflict (CAT-08, D-37, ErrorCode=version_conflict)
            with the current server-side agent record returned in `current`,
            OR a uniqueness collision raised by a PATCH that supplied an
            external_id already bound to another agent in the org
            (ErrorCode=duplicate_external_id; Phase 5 fix H1 — UPDATE 23505
            previously surfaced as 500 instead of 409). Clients should branch
            on ErrorCode, not parse the description text.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - allOf:
                      - $ref: "#/components/schemas/VersionConflictErrorResponse"
                      - type: object
                        properties:
                          current:
                            $ref: "#/components/schemas/Agent"
        "422":
          description: |
            Business-rule violation. ErrorCode disambiguates: (a)
            `immutable_field` — PATCH attempted to change a field that is
            immutable in v0.1 (e.g., `code`; rename support deferred to
            v0.2 per D04_1-02); (b) `invalid_reference` — a `skills[].skill_id`
            references a skill that does not exist in the caller's org
            (CAT-03, PUT-semantics replacement); (c) `invalid_value` — a
            `skills[].proficiency` value is outside the inclusive range
            1-10. The `field` slot in ErrorResponse identifies which
            request body path failed (e.g. `code` or `skills[0].proficiency`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Agents
      operationId: DeleteAgent
      summary: Soft-delete an agent
      description: >
        Soft-deletes the agent by setting `enabled=false`. The record persists
        in the database. Use `?include_disabled=true` on list endpoints to
        surface soft-deleted agents (CAT-09).
      security:
        - OrgHeader: []
      responses:
        "204":
          description: Agent disabled.
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Agent State (STATE-01 through STATE-09) ──────────────────────────────────

  /v1/orgs/{org_id}/agents/{id}/status:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/EntityIdPath"

    get:
      tags:
        - AgentState
      operationId: GetAgentStatus
      summary: Get agent state
      description: >
        Returns the current agent state record (STATE-01). The UI polls this
        endpoint every ~5 seconds (REST polling only in v0.1 — no SSE, OQ-3D).
        Use `state_version` to detect stale polling responses (STATE-08).
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Current agent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentState"
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - AgentState
      operationId: PatchAgentStatus
      summary: Transition agent state
      description: |
        Initiates an agent-state transition (STATE-02). Returns the full
        updated `AgentState` on success to avoid a follow-up GET (OQ-3C).

        **Allowed agent-initiated transitions** (STATE-02):
        - `NotReady → Ready`
        - `Ready → NotReady`
        - `Ready → Break` (requires `break_reason_id` — STATE-04)
        - `Break → Ready`
        - `Break → NotReady`
        - `WrapUp → Ready`
        - `WrapUp → NotReady`

        A transition not in the matrix returns HTTP 409 with the requested
        `from`/`to` pair in the body (STATE-03, D-37).

        `engaged_channel` is required when `to == Engaged`, but `Engaged` is
        system-initiated only — agents cannot self-transition to `Engaged`
        (STATE-05). Attempting it returns HTTP 409 `invalid_transition`.

        Setting `post_interaction_state` while the agent is `Engaged` stores
        the preference for the next WrapUp expiry transition (STATE-06).
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAgentStatusRequest"
      responses:
        "200":
          description: State transition succeeded. Returns the full updated agent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Invalid state transition. `from` and `to` identify the requested
            transition that is not in the allowed matrix (STATE-03, D-37).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTransitionErrorResponse"
        "422":
          description: >
            Semantically invalid request — e.g. `break_reason_id` not found
            or cross-org (STATE-04). Structurally valid JSON but business-rule
            violation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Skills (CAT-02) ──────────────────────────────────────────────────────────

  /v1/orgs/{org_id}/skills:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"

    post:
      tags:
        - Skills
      operationId: CreateSkill
      summary: Create a skill
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillRequest"
      responses:
        "201":
          description: Skill created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            Duplicate `code` within the org (ErrorCode=duplicate_code), or
            duplicate `external_id` within the org when set
            (ErrorCode=duplicate_external_id). Clients should branch on
            ErrorCode, not parse the description text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - Skills
      operationId: ListSkills
      summary: List skills
      description: >
        Returns a paginated list of skills. Used by the "Add skill" dropdown
        on Agent detail (OQ-1C — the org's skill list uses cursor pagination).
        Disabled skills excluded by default (CAT-09).
      security:
        - OrgHeader: []
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/IncludeDisabledQuery"
        - $ref: "#/components/parameters/NameSearchQuery"
      responses:
        "200":
          description: Paginated list of skills.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/orgs/{org_id}/skills/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/EntityIdPath"

    get:
      tags:
        - Skills
      operationId: GetSkill
      summary: Get skill by ID
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Skill record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Skills
      operationId: UpdateSkill
      summary: Update a skill
      description: >
        Partial update of a skill. Include `version` for optimistic concurrency
        (CAT-08).
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkillRequest"
      responses:
        "200":
          description: Skill updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Optimistic-concurrency conflict (D-37, ErrorCode=version_conflict)
            with the current server-side skill record returned in `current`,
            OR a uniqueness collision raised by a PATCH that supplied an
            external_id already bound to another skill in the org
            (ErrorCode=duplicate_external_id; Phase 5 fix H1). Clients should
            branch on ErrorCode, not parse the description text.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - allOf:
                      - $ref: "#/components/schemas/VersionConflictErrorResponse"
                      - type: object
                        properties:
                          current:
                            $ref: "#/components/schemas/Skill"
        "422":
          description: |
            Business-rule violation: `code` is immutable post-create
            (D04_1-02); PATCH attempting to change it returns
            ErrorCode=immutable_field. Rename support deferred to v0.2.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Skills
      operationId: DeleteSkill
      summary: Soft-delete a skill
      security:
        - OrgHeader: []
      responses:
        "204":
          description: Skill disabled.
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Queues (CAT-04) ──────────────────────────────────────────────────────────

  /v1/orgs/{org_id}/flows:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"

    post:
      tags:
        - Flows
      operationId: CreateFlow
      summary: Create a flow draft
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowRequest"
      responses:
        "201":
          description: Flow draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Duplicate `code` within the org (ErrorCode=duplicate_code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - Flows
      operationId: ListFlows
      summary: List flow drafts
      security:
        - OrgHeader: []
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/IncludeDisabledQuery"
        - $ref: "#/components/parameters/NameSearchQuery"
      responses:
        "200":
          description: Paginated list of flow drafts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Flow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/orgs/{org_id}/flows/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgIdPath"
      - $ref: "#/components/parameters/EntityIdPath"

    get:
      tags:
        - Flows
      operationId: GetFlow
      summary: Get a flow draft by ID
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Flow draft record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Flows
      operationId: UpdateFlow
      summary: Update a flow draft
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlowRequest"
      responses:
        "200":
          description: Flow draft updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Optimistic-concurrency conflict (ErrorCode=version_conflict) with the
            current server-side flow record returned in `current`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VersionConflictErrorResponse"
                  - type: object
                    properties:
                      current:
                        $ref: "#/components/schemas/Flow"
        "422":
          description: Immutable field violation (ErrorCode=immutable_field) when `code` differs from the stored value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Flows
