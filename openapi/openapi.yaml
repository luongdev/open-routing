      operationId: GetQueue
      summary: Get queue by ID
      security:
        - OrgHeader: []
      responses:
        "200":
          description: Queue record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Queues
      operationId: UpdateQueue
      summary: Update a queue
      security:
        - OrgHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQueueRequest"
      responses:
        "200":
          description: Queue updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Optimistic-concurrency conflict (D-37, ErrorCode=version_conflict)
            with the current server-side queue record returned in `current`,
            OR a uniqueness collision raised by a PATCH that supplied an
            external_id already bound to another queue in the org
            (ErrorCode=duplicate_external_id; Phase 5 fix H1). Clients should
            branch on ErrorCode, not parse the description text.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - allOf:
                      - $ref: "#/components/schemas/VersionConflictErrorResponse"
                      - type: object
                        properties:
                          current:
                            $ref: "#/components/schemas/Queue"
        "422":
          description: |
            Business-rule violation: `code` is immutable post-create
            (D04_1-02); PATCH attempting to change it returns
            ErrorCode=immutable_field. Rename support deferred to v0.2.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Queues
      operationId: DeleteQueue
      summary: Soft-delete a queue
      security:
        - OrgHeader: []
      responses:
        "204":
          description: Queue disabled.
        "400":
          $ref: "#/components/responses/InvalidOrgID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

