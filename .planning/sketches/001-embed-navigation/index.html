<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketch 001: Embed Navigation</title>
  
  <!-- Shoelace Theme & Autoloader (Matches target stack) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
  
  <link rel="stylesheet" href="../themes/default.css">
  <style>
    body {
      margin: 0;
      padding-top: 48px; /* space for variant nav */
      font-family: var(--font-sans);
      background-color: #d1d5db; /* dark background to simulate host app */
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    * {
      box-sizing: border-box;
    }
    
    /* Variant Nav styling */
    #variant-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9998;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 8px 16px;
      display: flex;
      gap: 8px;
    }
    .variant-tab {
      padding: 6px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: var(--text-sm);
      transition: all 0.15s ease;
    }
    .variant-tab:hover {
      background: var(--color-highlight);
      color: var(--color-primary-hover);
    }
    .variant-tab.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    /* Host App simulation wrapper */
    .host-app-container {
      margin-top: var(--space-8);
      width: 100%;
      max-width: 900px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--color-border);
      min-height: 600px;
      display: flex;
      flex-direction: column;
    }
    .host-app-header {
      background: #1e293b;
      color: white;
      padding: var(--space-4);
      font-weight: 600;
    }

    /* Sketch Toolbar */
    #sketch-tools {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 9999;
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(15, 23, 42, 0.85);
      color: white;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      opacity: 0.4;
      transition: opacity 0.2s ease;
      display: flex;
      gap: var(--space-4);
      align-items: center;
    }
    #sketch-tools:hover { opacity: 1; }

    /* The actual Embed UI styles */
    .embed-container {
      flex: 1;
      display: flex;
      background: var(--color-bg);
      position: relative;
    }

    /* Content Area */
    .embed-content {
      flex: 1;
      padding: var(--space-6);
    }
    .page-title {
      margin: 0 0 var(--space-6) 0;
      font-size: var(--text-xl);
      color: var(--color-text);
      font-weight: 600;
    }
    .placeholder-table {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      border-style: dashed;
    }

    /* Variant A: Top Nav */
    .var-a-nav {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      padding: 0 var(--space-6);
      gap: var(--space-6);
    }
    .var-a-nav-item {
      padding: var(--space-4) 0;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: var(--text-sm);
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .var-a-nav-item:hover {
      color: var(--color-text);
    }
    .var-a-nav-item.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }

    /* Variant B: Collapsible Sidebar */
    .var-b-sidebar {
      width: 64px; /* Default thin mode */
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      padding-top: var(--space-4);
      padding-bottom: var(--space-4);
      gap: var(--space-2);
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .var-b-sidebar.expanded {
      width: 200px;
    }
    .var-b-nav-item {
      height: 40px;
      display: flex;
      align-items: center;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: all 0.15s ease;
      position: relative;
      margin: 0 var(--space-3);
      padding: 0 10px; /* Space for the icon */
    }
    .var-b-nav-item:hover {
      background: var(--color-bg);
      color: var(--color-text);
    }
    .var-b-nav-item.active {
      background: var(--color-highlight);
      color: var(--color-primary-hover);
    }
    .var-b-nav-item sl-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .var-b-nav-label {
      margin-left: 12px;
      font-size: var(--text-sm);
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
      display: none;
    }
    .var-b-sidebar.expanded .var-b-nav-label {
      display: block;
      opacity: 1;
    }
    
    .sidebar-spacer {
      flex-grow: 1;
    }
    
    .sidebar-toggle {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 10px;
      margin: 0 var(--space-3);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .sidebar-toggle:hover {
      background: var(--color-bg);
      color: var(--color-text);
    }
    .sidebar-toggle sl-icon {
      font-size: 20px;
      transition: transform 0.2s ease;
    }
    .var-b-sidebar.expanded .sidebar-toggle sl-icon {
      transform: rotate(180deg);
    }
    .var-b-sidebar.expanded .sidebar-toggle {
      justify-content: flex-end;
    }

    /* Variant C: Dropdown Nav */
    .var-c-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-3) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .var-c-select {
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: var(--text-sm);
      font-weight: 500;
      outline: none;
      cursor: pointer;
      width: 200px;
    }
    .var-c-select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px var(--color-highlight);
    }

  </style>
</head>
<body>

  <!-- Variant Navigation -->
  <div id="variant-nav">
    <button class="variant-tab" onclick="showVariant('a', this)">A: Top Nav (Tabs)</button>
    <button class="variant-tab active" onclick="showVariant('b', this)">B: Collapsible Sidebar ★ Selected</button>
    <button class="variant-tab" onclick="showVariant('c', this)">C: Dropdown Selector</button>
  </div>

  <div class="host-app-container" id="preview-container">
    <div class="host-app-header">Host Application CRM</div>
    
    <!-- Variant A -->
    <div id="variant-a" class="variant" style="display:none; flex:1; flex-direction:column;">
      <div class="var-a-nav">
        <div class="var-a-nav-item active">Agents</div>
        <div class="var-a-nav-item">Skills</div>
        <div class="var-a-nav-item">Queues</div>
        <div class="var-a-nav-item">Channels</div>
        <div class="var-a-nav-item">Adapters</div>
        <div class="var-a-nav-item">Break Reasons</div>
      </div>
      <div class="embed-content">
        <h2 class="page-title">Agents</h2>
        <div class="placeholder-table">Data Table Mockup</div>
      </div>
    </div>

    <!-- Variant B -->
    <div id="variant-b" class="variant active" style="display:flex; flex:1;">
      <div class="embed-container">
        <div class="var-b-sidebar" id="sidebar">
          
          <sl-tooltip content="Agents" placement="right" id="tt-agents">
            <div class="var-b-nav-item active" data-title="Agents">
              <sl-icon name="person"></sl-icon>
              <span class="var-b-nav-label">Agents</span>
            </div>
          </sl-tooltip>
          
          <sl-tooltip content="Skills" placement="right" id="tt-skills">
            <div class="var-b-nav-item" data-title="Skills">
              <sl-icon name="lightning"></sl-icon>
              <span class="var-b-nav-label">Skills</span>
            </div>
          </sl-tooltip>
          
          <sl-tooltip content="Queues" placement="right" id="tt-queues">
            <div class="var-b-nav-item" data-title="Queues">
              <sl-icon name="layers"></sl-icon>
              <span class="var-b-nav-label">Queues</span>
            </div>
          </sl-tooltip>
          
          <sl-tooltip content="Channels" placement="right" id="tt-channels">
            <div class="var-b-nav-item" data-title="Channels">
              <sl-icon name="chat-dots"></sl-icon>
              <span class="var-b-nav-label">Channels</span>
            </div>
          </sl-tooltip>
          
          <sl-tooltip content="Adapters" placement="right" id="tt-adapters">
            <div class="var-b-nav-item" data-title="Adapters">
              <sl-icon name="plug"></sl-icon>
              <span class="var-b-nav-label">Adapters</span>
            </div>
          </sl-tooltip>
          
          <sl-tooltip content="Break Reasons" placement="right" id="tt-breaks">
            <div class="var-b-nav-item" data-title="Break Reasons">
              <sl-icon name="cup-hot"></sl-icon>
              <span class="var-b-nav-label">Break Reasons</span>
            </div>
          </sl-tooltip>

          <div class="sidebar-spacer"></div>

          <button class="sidebar-toggle" id="toggle-sidebar" title="Expand sidebar">
            <sl-icon name="layout-sidebar"></sl-icon>
          </button>
        </div>
        <div class="embed-content">
          <h2 class="page-title" id="var-b-title">Agents</h2>
          <div class="placeholder-table">Data Table Mockup</div>
        </div>
      </div>
    </div>

    <!-- Variant C -->
    <div id="variant-c" class="variant" style="display:none; flex:1; flex-direction:column;">
      <div class="var-c-header">
        <h2 class="page-title" style="margin:0; font-size:var(--text-lg)">Open Routing Catalog</h2>
        <select class="var-c-select" onchange="document.getElementById('vc-title').innerText = this.options[this.selectedIndex].text">
          <option>Agents</option>
          <option>Skills</option>
          <option>Queues</option>
          <option>Channels</option>
          <option>Adapters</option>
          <option>Break Reasons</option>
        </select>
      </div>
      <div class="embed-content">
        <h2 class="page-title" id="vc-title">Agents</h2>
        <div class="placeholder-table">Data Table Mockup</div>
      </div>
    </div>

  </div>

  <div id="sketch-tools">
    <label>Width:
      <select onchange="document.getElementById('preview-container').style.maxWidth = this.value">
        <option value="900px">Desktop (900px)</option>
        <option value="768px">Tablet (768px)</option>
        <option value="100%">Full (100%)</option>
      </select>
    </label>
  </div>

  <script>
    function showVariant(id, btn) {
      document.querySelectorAll('.variant').forEach(v => {
        v.style.display = 'none';
        v.classList.remove('active');
      });
      document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
      
      const target = document.getElementById('variant-' + id);
      target.style.display = target.style.flexDirection ? 'flex' : 'block';
      target.classList.add('active');
      btn.classList.add('active');
    }

    // Interactivity for nav items in A
    document.querySelectorAll('.var-a-nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.var-a-nav-item').forEach(i => i.classList.remove('active'));
        e.target.classList.add('active');
        document.querySelector('#variant-a .page-title').innerText = e.target.innerText;
      });
    });

    // Interactivity for Variant B Sidebar
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    
    // Toggle expand/collapse
    toggleBtn.addEventListener('click', () => {
      const isExpanded = sidebar.classList.toggle('expanded');
      
      // Disable tooltips when expanded
      document.querySelectorAll('sl-tooltip').forEach(tt => {
        tt.disabled = isExpanded;
      });
    });

    // Nav item click
    document.querySelectorAll('.var-b-nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.var-b-nav-item').forEach(i => i.classList.remove('active'));
        const el = e.target.closest('.var-b-nav-item');
        el.classList.add('active');
        document.getElementById('var-b-title').innerText = el.getAttribute('data-title');
      });
    });
  </script>
</body>
</html>
